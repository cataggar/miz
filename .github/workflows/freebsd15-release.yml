name: Publish FreeBSD 15.1 images

on:
  workflow_dispatch:
    inputs:
      release_set:
        description: Which FreeBSD 15.1 release set to build and publish
        type: choice
        required: true
        default: zfs
        options:
          - zfs
      release_date:
        description: Explicit reviewed YYYYMMDD date for the combined ZFS release
        type: string
        required: true
      validation_only:
        description: Validate the combined ZFS release without creating a tag or mutating a GitHub release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Only one combined ZFS release run may stage or publish at a time.
concurrency:
  group: freebsd15-release-${{ inputs.release_set }}
  cancel-in-progress: false

jobs:
  prepare:
    name: resolve immutable main source
    if: github.repository == 'cataggar/vmiz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      matrix: ${{ steps.set.outputs.matrix }}
      azure_matrix: ${{ steps.set.outputs.azure_matrix }}
      release_tag: ${{ steps.set.outputs.release_tag }}
      release_title: ${{ steps.set.outputs.release_title }}
      asset_count: ${{ steps.set.outputs.asset_count }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind release to source commit
        id: source
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse origin/main)" = "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Accepted source commit: \`$commit\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the requested release set
        id: set
        env:
          RELEASE_SET: ${{ inputs.release_set }}
          RELEASE_DATE: ${{ inputs.release_date }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          set -euo pipefail
          case "$VALIDATION_ONLY" in
            true|false) ;;
            *)
              echo "::error::validation_only must be an explicit boolean"
              exit 1
              ;;
          esac
          test "$RELEASE_SET" = zfs
          [[ "$RELEASE_DATE" =~ ^[0-9]{8}$ ]]
          matrix=$(python3 scripts/freebsd15_release.py matrix \
            --release-set "$RELEASE_SET")
          azure_matrix=$(python3 scripts/freebsd15_release.py azure-matrix \
            --release-set "$RELEASE_SET")
          test "$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$matrix")" -eq 4
          test "$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$azure_matrix")" -eq 4
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "azure_matrix=$azure_matrix" >> "$GITHUB_OUTPUT"
          python3 scripts/freebsd15_release.py describe \
            --release-set "$RELEASE_SET" \
            --release-date "$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          echo "Release set: \`$RELEASE_SET\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed ZFS release date: \`$RELEASE_DATE\`" \
            >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build and validate ${{ matrix.variant }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      VARIANT: ${{ matrix.variant }}
      ARCHITECTURE: ${{ matrix.architecture }}
      FILESYSTEM: ${{ matrix.filesystem }}
      FLAVOR: ${{ matrix.flavor }}
      ASSET_NAME: ${{ matrix.asset_name }}
      SOURCE_NAME: ${{ matrix.source_name }}
      SOURCE_URL: ${{ matrix.source_url }}
      SOURCE_SHA256: ${{ matrix.source_sha256 }}
      VIRTUAL_SIZE: ${{ matrix.virtual_size }}
      QEMU: ${{ matrix.qemu }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      WORK_DIR: .scratch/generalized-freebsd15-${{ matrix.variant }}
      CANDIDATE_DIR: candidate
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install image build dependencies
        run: |
          set -euo pipefail
          case "$ARCHITECTURE" in
            aarch64)
              platform_packages=(qemu-efi-aarch64 qemu-system-arm)
              expected_uname=aarch64
              ;;
            x86_64)
              platform_packages=(ovmf qemu-system-x86)
              expected_uname=x86_64
              ;;
            *)
              exit 1
              ;;
          esac
          test "$(uname -m)" = "$expected_uname"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl jq openssh-client qemu-utils \
            "${platform_packages[@]}"
          test -x "$QEMU"

      - name: Cache verified FreeBSD source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.WORK_DIR }}/${{ env.SOURCE_NAME }}
          key: freebsd-15.1-${{ matrix.variant }}-basic-cloudinit-${{ env.SOURCE_SHA256 }}

      - name: Build generalized QCOW2
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE_DIR"
          zig build generalized-freebsd15 -- \
            --architecture "$ARCHITECTURE" \
            --filesystem "$FILESYSTEM" \
            --flavor "$FLAVOR" \
            --work-dir "$GITHUB_WORKSPACE/$WORK_DIR" \
            --output "$GITHUB_WORKSPACE/$CANDIDATE_DIR/$ASSET_NAME" \
            --qemu "$QEMU" \
            --timeout 3600 2>&1 |
            tee "$RUNNER_TEMP/freebsd15-$VARIANT-build.log"

      - name: Validate release image
        run: |
          set -euo pipefail
          asset="$CANDIDATE_DIR/$ASSET_NAME"
          image_info="$CANDIDATE_DIR/qemu-img-info.json"
          qemu-img check "$asset"
          qemu-img info --output=json "$asset" > "$image_info"
          test "$(jq -r '.format' "$image_info")" = qcow2
          test "$(jq -r '."virtual-size"' "$image_info")" = "$VIRTUAL_SIZE"
          test "$(jq -r '."backing-filename" // ""' "$image_info")" = ""
          test "$(jq -r '."format-specific".data."compression-type"' "$image_info")" = zstd
          zig build run -- check "$asset"

      - name: Run dual-instance QEMU acceptance
        env:
          VMIZ_FREEBSD15_ARCHITECTURE: ${{ matrix.architecture }}
          VMIZ_FREEBSD15_FILESYSTEM: ${{ matrix.filesystem }}
          VMIZ_FREEBSD15_FLAVOR: ${{ matrix.flavor }}
          VMIZ_FREEBSD15_IMAGE: ${{ github.workspace }}/${{ env.CANDIDATE_DIR }}/${{ env.ASSET_NAME }}
          VMIZ_FREEBSD15_QEMU: ${{ matrix.qemu }}
        run: zig build test-freebsd15-boot

      - name: Record validated candidate
        run: |
          set -euo pipefail
          asset="$CANDIDATE_DIR/$ASSET_NAME"
          source="$WORK_DIR/$SOURCE_NAME"
          asset_sha256=$(sha256sum "$asset" | awk '{print $1}')
          source_sha256=$(sha256sum "$source" | awk '{print $1}')
          test "$source_sha256" = "$SOURCE_SHA256"
          qemu_version=$("$QEMU" --version | head -n 1)
          python3 scripts/freebsd15_release.py candidate \
            --architecture "$ARCHITECTURE" \
            --filesystem "$FILESYSTEM" \
            --flavor "$FLAVOR" \
            --asset "$asset" \
            --package-manifest "$asset.packages.txt" \
            --validated-sha256 "$asset_sha256" \
            --virtual-size "$VIRTUAL_SIZE" \
            --qemu-info "$CANDIDATE_DIR/qemu-img-info.json" \
            --source-name "$SOURCE_NAME" \
            --source-url "$SOURCE_URL" \
            --source-sha256 "$source_sha256" \
            --source-bytes "$(stat --format='%s' "$source")" \
            --source-commit "$SOURCE_COMMIT" \
            --qemu-version "$qemu_version" \
            --runner "${{ matrix.runner }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$CANDIDATE_DIR/candidate.json"
          {
            echo "### $VARIANT"
            echo
            echo "- Virtual size: $VIRTUAL_SIZE bytes"
            echo "- Allocated size: $(jq -r '."actual-size"' "$CANDIDATE_DIR/qemu-img-info.json") bytes"
            echo "- Compressed/download size: $(stat --format='%s' "$asset") bytes"
            echo "- Packages: $(wc -l < "$asset.packages.txt")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact validated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freebsd15-candidate-${{ matrix.variant }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_DIR }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  azure_acceptance:
    name: Azure ${{ matrix.key }}
    needs: [prepare, build]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.build.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # Reuse the established OIDC subscription and architecture-specific
    # location/VM configuration used by Azure Linux acceptance.
    environment: azurelinux4-release
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.azure_matrix) }}
    env:
      CANDIDATE_KEY: ${{ matrix.key }}
      ARCHITECTURE: ${{ matrix.architecture }}
      FILESYSTEM: ${{ matrix.filesystem }}
      FLAVOR: ${{ matrix.flavor }}
      ASSET_NAME: ${{ matrix.asset_name }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      CANDIDATE_DIR: .release/azure/${{ matrix.key }}/candidate
      RESULT_DIR: artifact-staging/azure-results/${{ matrix.key }}
      STATE_FILE: .release/azure/${{ matrix.key }}/resource-group
      AZURE_LOCATION: ${{ vars[matrix.location_variable] }}
      AZURE_VM_SIZE: ${{ vars[matrix.size_variable] }}
    steps:
      - name: Check out acceptance harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: release-source
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download exact build-validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: freebsd15-candidate-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_DIR }}

      - name: Fail closed on missing protected configuration
        env:
          AZURE_CLIENT_ID_VALUE: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID_VALUE: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID_VALUE: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$AZURE_CLIENT_ID_VALUE" =~ $uuid ]]
          [[ "$AZURE_TENANT_ID_VALUE" =~ $uuid ]]
          [[ "$AZURE_SUBSCRIPTION_ID_VALUE" =~ $uuid ]]
          [[ "$AZURE_LOCATION" =~ ^[a-z0-9-]+$ ]]
          [[ "$AZURE_VM_SIZE" =~ ^Standard_[A-Za-z0-9_]+$ ]]

      - name: Log in to Azure with protected-environment OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Require Azure acceptance tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client qemu-utils
          for tool in az azcopy qemu-img ssh ssh-keygen python3; do
            command -v "$tool" >/dev/null
          done
          az version --output json > /dev/null

      - name: Build accepted-source vmiz
        working-directory: release-source
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          zig build --fetch \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build -Doptimize=ReleaseSafe
          test -x zig-out/bin/vmiz

      - name: Refresh Azure OIDC credential before acceptance
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run exact-artifact Azure acceptance
        env:
          VMIZ: ${{ github.workspace }}/release-source/zig-out/bin/vmiz
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          export GITHUB_RUN_ID=$RUN_ID_VALUE
          export GITHUB_RUN_ATTEMPT=$RUN_ATTEMPT_VALUE
          scripts/freebsd15_azure_acceptance.sh run

      - name: Refresh Azure OIDC credential for unconditional cleanup
        if: always()
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete only owned temporary Azure resources
        if: always()
        env:
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          export GITHUB_RUN_ID=$RUN_ID_VALUE
          export GITHUB_RUN_ATTEMPT=$RUN_ATTEMPT_VALUE
          if [[ -x scripts/freebsd15_azure_acceptance.sh ]]; then
            scripts/freebsd15_azure_acceptance.sh cleanup
          elif [[ -s "$STATE_FILE" ]]; then
            echo "::error::Cleanup script is absent while Azure state exists"
            exit 1
          fi

      - name: Upload failed Azure acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freebsd15-azure-failure-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ env.RESULT_DIR }}/*.json
            ${{ env.RESULT_DIR }}/boot.log*
            ${{ env.RESULT_DIR }}/uefi-db.bin
            ${{ env.RESULT_DIR }}/guest-contract.stdout
            ${{ env.RESULT_DIR }}/guest-contract.stderr
          if-no-files-found: warn
          retention-days: 2

      - name: Upload exact Azure acceptance result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freebsd15-azure-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}/azure-result.json
          if-no-files-found: error
          retention-days: 2

      - name: Remove derived VHD and local credentials
        if: always()
        run: rm -rf -- ".release/azure/$CANDIDATE_KEY" "$RESULT_DIR"

  stage:
    name: verify release-set gate and stage
    needs: [prepare, build, azure_acceptance]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.build.result == 'success' &&
        needs.azure_acceptance.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      RELEASE_SET: ${{ inputs.release_set }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
      RELEASE_DATE: ${{ inputs.release_date }}
      CANDIDATES_DIR: .release/freebsd15/candidates
      STAGING_ROOT: .release/freebsd15/staging
      AZURE_RESULTS_DIR: .release/freebsd15/azure-results
      AZURE_RESULT: ${{ needs.azure_acceptance.result }}
      EXPECTED_ASSET_COUNT: ${{ needs.prepare.outputs.asset_count }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download every build-validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: freebsd15-candidate-*-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.CANDIDATES_DIR }}
          merge-multiple: false

      - name: Download Azure acceptance results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: freebsd15-azure-*-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.AZURE_RESULTS_DIR }}
          merge-multiple: false

      - name: Fail closed on incomplete Azure gate
        run: |
          set -euo pipefail
          test "$AZURE_RESULT" = success
          test -d "$AZURE_RESULTS_DIR"
          count=$(find "$AZURE_RESULTS_DIR" -name 'azure-result.json' | wc -l)
          test "$count" -eq "$EXPECTED_ASSET_COUNT"

      - name: Stage and verify only the exact release-set allowlist
        run: scripts/freebsd15_stage_release.sh

      - name: Upload short-lived validation evidence
        if: inputs.validation_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freebsd15-validation-evidence-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.STAGING_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Upload short-lived publication plan
        if: inputs.validation_only == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freebsd15-publication-plan-${{ inputs.release_set }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.STAGING_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish verified release plan
    needs: [prepare, stage]
    if: >-
      ${{
        always() &&
        inputs.validation_only == false &&
        github.repository == 'cataggar/vmiz' &&
        github.ref == 'refs/heads/main' &&
        needs.prepare.result == 'success' &&
        needs.stage.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      RELEASE_SET: ${{ inputs.release_set }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
      RELEASE_DATE: ${{ inputs.release_date }}
      CANDIDATES_DIR: .release/freebsd15/candidates
      STAGING_ROOT: .release/freebsd15/publication-staging
      PLAN_DIR: .release/freebsd15/publication-plan
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      AZURE_RESULTS_DIR: .release/freebsd15/azure-results
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download every build-validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: freebsd15-candidate-*-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.CANDIDATES_DIR }}
          merge-multiple: false

      - name: Download Azure acceptance results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: freebsd15-azure-*-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.AZURE_RESULTS_DIR }}
          merge-multiple: false

      - name: Download verified publication plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: freebsd15-publication-plan-${{ inputs.release_set }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.PLAN_DIR }}

      - name: Reproduce the verified release plan
        run: |
          set -euo pipefail
          scripts/freebsd15_stage_release.sh
          diff --recursive --brief "$PLAN_DIR" "$STAGING_ROOT/evidence"

      - name: Mutate the GitHub release from the verified plan
        run: scripts/freebsd15_publish.sh
