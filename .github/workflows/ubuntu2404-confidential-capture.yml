# Protected-environment setup and least-privilege RBAC are documented in
# doc/azure-confidential-vm.md. This workflow never creates, updates, or
# deletes the durable target resource group, gallery, or image definition.
name: Capture Ubuntu 24.04 confidential gallery image

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: Accepted three-asset Ubuntu 24.04 confidential release
        required: true
        default: Ubuntu-24.04-confidential-20260907
        type: string
      target_gallery_version:
        description: New semantic Azure Compute Gallery version (major.minor.patch)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ubuntu2404-confidential-cvm-target-version
  cancel-in-progress: false

env:
  SOURCE_QCOW_NAME: Ubuntu-24.04-x86_64.confidential.qcow2
  SOURCE_PROVENANCE_NAME: Ubuntu-24.04-x86_64.confidential.qcow2.provenance.json
  SOURCE_ACCEPTANCE_NAME: Ubuntu-24.04-x86_64.confidential.azure-acceptance.json
  PUBLICATION_LOCK_ID: ubuntu2404-confidential-cvm-target-version

jobs:
  prepare:
    name: resolve immutable source and publication identities
    if: github.repository == 'cataggar/miz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tool_commit: ${{ steps.resolve.outputs.tool_commit }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      source_release_id: ${{ steps.resolve.outputs.source_release_id }}
      source_qcow_asset_id: ${{ steps.resolve.outputs.source_qcow_asset_id }}
      source_provenance_asset_id: ${{ steps.resolve.outputs.source_provenance_asset_id }}
      source_acceptance_asset_id: ${{ steps.resolve.outputs.source_acceptance_asset_id }}
      provenance_release_tag: ${{ steps.resolve.outputs.provenance_release_tag }}
      provenance_release_title: ${{ steps.resolve.outputs.provenance_release_title }}
      provenance_asset_name: ${{ steps.resolve.outputs.provenance_asset_name }}
      target_gallery_version: ${{ steps.resolve.outputs.target_gallery_version }}
    steps:
      - name: Check out current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact source release and unused provenance release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag }}
          TARGET_GALLERY_VERSION: ${{ inputs.target_gallery_version }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = cataggar/miz
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          [[ "$GITHUB_REF" != refs/pull/* ]]
          [[ "$SOURCE_RELEASE_TAG" =~ ^Ubuntu-24\.04-confidential-[0-9]{8}$ ]]
          source_release_date=${SOURCE_RELEASE_TAG##*-}
          source_release_iso="${source_release_date:0:4}-${source_release_date:4:2}-${source_release_date:6:2}"
          test "$(date -u -d "$source_release_iso" +%Y%m%d)" = "$source_release_date"
          source_release_title="Ubuntu 24.04 Confidential VM - $source_release_date"
          [[ "$TARGET_GALLERY_VERSION" =~ ^(0|[1-9][0-9]{0,9})\.(0|[1-9][0-9]{0,9})\.(0|[1-9][0-9]{0,9})$ ]]
          IFS=. read -r target_major target_minor target_patch <<<"$TARGET_GALLERY_VERSION"
          (( 10#$target_major <= 2147483647 ))
          (( 10#$target_minor <= 2147483647 ))
          (( 10#$target_patch <= 2147483647 ))
          (( 10#$target_major != 0 || 10#$target_minor != 0 || 10#$target_patch != 0 ))

          tool_commit=$(git rev-parse HEAD)
          [[ "$tool_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse origin/main)" = "$tool_commit"
          remote_main=$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')
          test "$remote_main" = "$tool_commit"

          direct_source=$(git ls-remote origin "refs/tags/$SOURCE_RELEASE_TAG" | awk 'NR == 1 {print $1}')
          peeled_source=$(git ls-remote origin "refs/tags/$SOURCE_RELEASE_TAG^{}" | awk 'NR == 1 {print $1}')
          source_commit=${peeled_source:-$direct_source}
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]

          provenance_release_tag="Ubuntu-24.04-confidential-cvm-$TARGET_GALLERY_VERSION"
          provenance_release_title="Ubuntu 24.04 Confidential VM gallery provenance $TARGET_GALLERY_VERSION"
          provenance_asset_name="Ubuntu-24.04-x86_64.confidential-cvm-$TARGET_GALLERY_VERSION.provenance.json"
          direct_provenance=$(git ls-remote origin "refs/tags/$provenance_release_tag" | awk 'NR == 1 {print $1}')
          peeled_provenance=$(git ls-remote origin "refs/tags/$provenance_release_tag^{}" | awk 'NR == 1 {print $1}')
          provenance_commit=${peeled_provenance:-$direct_provenance}
          test "$provenance_commit" = "$tool_commit"

          mkdir -p .capture/prepare
          source_release_json=.capture/prepare/source-release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_RELEASE_TAG" \
            >"$source_release_json"
          jq -e \
            --arg tag "$SOURCE_RELEASE_TAG" \
            --arg title "$source_release_title" \
            --arg qcow "$SOURCE_QCOW_NAME" \
            --arg provenance "$SOURCE_PROVENANCE_NAME" \
            --arg acceptance "$SOURCE_ACCEPTANCE_NAME" \
            '
            .tag_name == $tag and
            .name == $title and
            .draft == false and
            .prerelease == false and
            (.id | type == "number" and . > 0) and
            (.assets | type == "array" and length == 3) and
            ([.assets[].name] | sort) == ([$qcow, $provenance, $acceptance] | sort) and
            all(.assets[];
              (.id | type == "number" and . > 0) and
              .state == "uploaded" and
              (.size | type == "number" and . > 0))
            ' "$source_release_json" >/dev/null

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$provenance_release_tag" \
              >.capture/prepare/reused-provenance-release.json \
              2>.capture/prepare/reused-provenance-release.stderr; then
            echo "::error::Provenance release already exists; refusing reuse"
            exit 1
          fi
          grep -Eq 'HTTP 404|Not Found' \
            .capture/prepare/reused-provenance-release.stderr

          source_release_id=$(jq -er '.id' "$source_release_json")
          source_qcow_asset_id=$(jq -er \
            --arg name "$SOURCE_QCOW_NAME" \
            '.assets[] | select(.name == $name) | .id' "$source_release_json")
          source_provenance_asset_id=$(jq -er \
            --arg name "$SOURCE_PROVENANCE_NAME" \
            '.assets[] | select(.name == $name) | .id' "$source_release_json")
          source_acceptance_asset_id=$(jq -er \
            --arg name "$SOURCE_ACCEPTANCE_NAME" \
            '.assets[] | select(.name == $name) | .id' "$source_release_json")
          {
            echo "tool_commit=$tool_commit"
            echo "source_commit=$source_commit"
            echo "source_release_id=$source_release_id"
            echo "source_qcow_asset_id=$source_qcow_asset_id"
            echo "source_provenance_asset_id=$source_provenance_asset_id"
            echo "source_acceptance_asset_id=$source_acceptance_asset_id"
            echo "provenance_release_tag=$provenance_release_tag"
            echo "provenance_release_title=$provenance_release_title"
            echo "provenance_asset_name=$provenance_asset_name"
            echo "target_gallery_version=$TARGET_GALLERY_VERSION"
          } >>"$GITHUB_OUTPUT"

  capture:
    name: protected staged Azure capture
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: ubuntu2404-confidential-capture
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      capture_result_sha256: ${{ steps.result.outputs.capture_result_sha256 }}
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      TOOL_COMMIT: ${{ needs.prepare.outputs.tool_commit }}
      SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag }}
      TARGET_IMAGE_VERSION: ${{ needs.prepare.outputs.target_gallery_version }}
      PROTECTED_ENVIRONMENT: ubuntu2404-confidential-capture
      SOURCE_REPOSITORY: cataggar/miz
      CANDIDATE_DIR: ${{ github.workspace }}/.capture/source
      CANDIDATE: ${{ github.workspace }}/.capture/source/Ubuntu-24.04-x86_64.confidential.qcow2
      PROVENANCE: ${{ github.workspace }}/.capture/source/Ubuntu-24.04-x86_64.confidential.qcow2.provenance.json
      SOURCE_ACCEPTANCE: ${{ github.workspace }}/.capture/source/Ubuntu-24.04-x86_64.confidential.azure-acceptance.json
      RESULT_DIR: ${{ github.workspace }}/.capture/evidence
      STATE_FILE: ${{ github.workspace }}/.capture/state/capture-state.json
      CLEANUP_LOGIN_MARKER: ${{ github.workspace }}/.capture/state/cleanup-login-succeeded
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.capture/azure/capture
      PUBLICATION_AZURE_CONFIG_DIR: ${{ github.workspace }}/.capture/azure/publication
      RELEASE_TOOL: ${{ github.workspace }}/zig-out/bin/ubuntu2404_confidential_release
      UBUNTU2404_CONFIDENTIAL_RELEASE_TOOL: ${{ github.workspace }}/zig-out/bin/ubuntu2404_confidential_release
      MIZ: ${{ github.workspace }}/zig-out/bin/miz
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_VM_SIZE: ${{ vars.AZURE_VM_SIZE }}
      TARGET_LOCATION: ${{ vars.AZURE_LOCATION }}
      TARGET_RESOURCE_GROUP: ${{ vars.TARGET_RESOURCE_GROUP }}
      TARGET_GALLERY: ${{ vars.TARGET_GALLERY }}
      TARGET_IMAGE_DEFINITION: ${{ vars.TARGET_IMAGE_DEFINITION }}
      TARGET_OWNER_TAG: ${{ vars.TARGET_OWNER_TAG }}
      PUBLICATION_LOCK_ID: ubuntu2404-confidential-cvm-target-version
      CAPTURE_PRINCIPAL_CLIENT_ID: ${{ secrets.AZURE_CAPTURE_CLIENT_ID }}
      PUBLICATION_PRINCIPAL_CLIENT_ID: ${{ secrets.AZURE_PUBLICATION_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out immutable capture tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.tool_commit }}
          persist-credentials: false

      - name: Validate protected configuration and private contexts
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$TOOL_COMMIT"
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$CAPTURE_PRINCIPAL_CLIENT_ID" =~ $uuid ]]
          [[ "$PUBLICATION_PRINCIPAL_CLIENT_ID" =~ $uuid ]]
          [[ "$AZURE_TENANT_ID" =~ $uuid ]]
          [[ "$AZURE_SUBSCRIPTION_ID" =~ $uuid ]]
          test "${CAPTURE_PRINCIPAL_CLIENT_ID,,}" != "${PUBLICATION_PRINCIPAL_CLIENT_ID,,}"
          [[ "$AZURE_LOCATION" =~ ^[a-z0-9-]+$ ]]
          [[ "$AZURE_VM_SIZE" =~ ^Standard_[A-Za-z0-9_]+$ ]]
          [[ "$TARGET_RESOURCE_GROUP" =~ ^[A-Za-z0-9._()-]{1,90}$ ]]
          [[ "$TARGET_GALLERY" =~ ^[A-Za-z0-9_]{1,80}$ ]]
          [[ "$TARGET_IMAGE_DEFINITION" =~ ^[A-Za-z0-9._()-]{1,80}$ ]]
          [[ "$TARGET_OWNER_TAG" =~ ^[A-Za-z0-9._:/-]{1,128}$ ]]
          rm -rf -- .capture
          mkdir -m 0700 -p \
            "$CANDIDATE_DIR" "$RESULT_DIR" "$(dirname "$STATE_FILE")" \
            "$AZURE_CONFIG_DIR" "$PUBLICATION_AZURE_CONFIG_DIR"

      - name: Download exactly the accepted three-asset source release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE_ID: ${{ needs.prepare.outputs.source_release_id }}
          SOURCE_QCOW_ASSET_ID: ${{ needs.prepare.outputs.source_qcow_asset_id }}
          SOURCE_PROVENANCE_ASSET_ID: ${{ needs.prepare.outputs.source_provenance_asset_id }}
          SOURCE_ACCEPTANCE_ASSET_ID: ${{ needs.prepare.outputs.source_acceptance_asset_id }}
        run: |
          set -euo pipefail
          umask 077
          direct_source=$(git ls-remote origin "refs/tags/$SOURCE_RELEASE_TAG" | awk 'NR == 1 {print $1}')
          peeled_source=$(git ls-remote origin "refs/tags/$SOURCE_RELEASE_TAG^{}" | awk 'NR == 1 {print $1}')
          test "${peeled_source:-$direct_source}" = "$SOURCE_COMMIT"
          source_release_title="Ubuntu 24.04 Confidential VM - ${SOURCE_RELEASE_TAG##*-}"
          release_json=.capture/source-release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_RELEASE_TAG" \
            >"$release_json"
          jq -e \
            --argjson release_id "$SOURCE_RELEASE_ID" \
            --arg title "$source_release_title" \
            --arg qcow "$SOURCE_QCOW_NAME" \
            --arg provenance "$SOURCE_PROVENANCE_NAME" \
            --arg acceptance "$SOURCE_ACCEPTANCE_NAME" \
            --argjson qcow_id "$SOURCE_QCOW_ASSET_ID" \
            --argjson provenance_id "$SOURCE_PROVENANCE_ASSET_ID" \
            --argjson acceptance_id "$SOURCE_ACCEPTANCE_ASSET_ID" \
            '
            .id == $release_id and
            .tag_name == env.SOURCE_RELEASE_TAG and
            .name == $title and
            .draft == false and .prerelease == false and
            (.assets | length == 3) and
            ([.assets[].name] | sort) == ([$qcow, $provenance, $acceptance] | sort) and
            ([.assets[] | select(.name == $qcow and .id == $qcow_id)] | length) == 1 and
            ([.assets[] | select(.name == $provenance and .id == $provenance_id)] | length) == 1 and
            ([.assets[] | select(.name == $acceptance and .id == $acceptance_id)] | length) == 1
            ' "$release_json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$SOURCE_QCOW_ASSET_ID" \
            -H 'Accept: application/octet-stream' >"$CANDIDATE"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$SOURCE_PROVENANCE_ASSET_ID" \
            -H 'Accept: application/octet-stream' >"$PROVENANCE"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$SOURCE_ACCEPTANCE_ASSET_ID" \
            -H 'Accept: application/octet-stream' >"$SOURCE_ACCEPTANCE"
          chmod 0600 "$CANDIDATE" "$PROVENANCE" "$SOURCE_ACCEPTANCE"
          test "$(find "$CANDIDATE_DIR" -maxdepth 1 -type f | wc -l)" -eq 3
          test -s "$CANDIDATE"
          test -s "$PROVENANCE"
          test -s "$SOURCE_ACCEPTANCE"

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Require capture tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl jq openssh-client openssl qemu-utils unzip
          for tool in az azcopy cmp curl gh jq openssl qemu-img scp sha256sum ssh ssh-keygen unzip; do
            command -v "$tool" >/dev/null
          done
          az version --output json >/dev/null

      - name: Build immutable capture and accepted-source tooling
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.capture/zig-global-cache
          bash scripts/zig_fetch_retry.sh --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build -Doptimize=ReleaseSafe \
            install-miz install-ubuntu2404-confidential-release
          test -x "$MIZ"
          test -x "$RELEASE_TOOL"

      - name: Validate source shape hashes and protected source identity
        run: |
          set -euo pipefail
          "$RELEASE_TOOL" verify-build \
            --provenance "$PROVENANCE" \
            --qcow "$CANDIDATE" >/dev/null
          source_location=$(jq -er '.azure.location | strings' "$SOURCE_ACCEPTANCE")
          source_vm_size=$(jq -er '.azure.vm_size | strings' "$SOURCE_ACCEPTANCE")
          source_group=$(jq -er '.azure.resource_group | strings' "$SOURCE_ACCEPTANCE")
          accepted_source_version=$(jq -er \
            '.azure.gallery_image_version_id | strings' "$SOURCE_ACCEPTANCE")
          [[ "$source_location" =~ ^[a-z0-9-]+$ ]]
          [[ "$source_vm_size" =~ ^Standard_[A-Za-z0-9_]+$ ]]
          [[ "$source_group" =~ ^miz-u2404-cvm-([1-9][0-9]{0,19})-([1-9][0-9]{0,9})$ ]]
          source_run_id=${BASH_REMATCH[1]}
          source_run_attempt=${BASH_REMATCH[2]}
          test "$source_location" = "$AZURE_LOCATION"
          test "$source_vm_size" = "$AZURE_VM_SIZE"
          [[ "${accepted_source_version,,}" == \
            "/subscriptions/${AZURE_SUBSCRIPTION_ID,,}/resourcegroups/"* ]]
          "$RELEASE_TOOL" verify-acceptance \
            --result "$SOURCE_ACCEPTANCE" \
            --provenance "$PROVENANCE" \
            --qcow "$CANDIDATE" \
            --source-commit "$SOURCE_COMMIT" \
            --location "$source_location" \
            --vm-size "$source_vm_size" \
            --run-id "$source_run_id" \
            --run-attempt "$source_run_attempt" >/dev/null
          {
            echo "SOURCE_LOCATION=$source_location"
            echo "SOURCE_VM_SIZE=$source_vm_size"
            echo "SOURCE_RUN_ID=$source_run_id"
            echo "SOURCE_RUN_ATTEMPT=$source_run_attempt"
          } >>"$GITHUB_ENV"
          {
            echo "Source release: \`$SOURCE_RELEASE_TAG\`"
            echo "Source commit: \`$SOURCE_COMMIT\`"
            echo "QCOW2 SHA-256: \`$(sha256sum "$CANDIDATE" | awk '{print $1}')\`"
            echo "Build provenance SHA-256: \`$(sha256sum "$PROVENANCE" | awk '{print $1}')\`"
            echo "Azure acceptance SHA-256: \`$(sha256sum "$SOURCE_ACCEPTANCE" | awk '{print $1}')\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Log in capture principal with protected-environment OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CAPTURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare source recreation capture VM and snapshot
        run: scripts/ubuntu2404_confidential_capture.sh prepare

      - name: Log in exclusive publication principal only when prepared
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        env:
          AZURE_CONFIG_DIR: ${{ env.PUBLICATION_AZURE_CONFIG_DIR }}
        with:
          client-id: ${{ secrets.AZURE_PUBLICATION_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refresh capture OIDC immediately before publication validation
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        env:
          AZURE_CONFIG_DIR: ${{ env.AZURE_CONFIG_DIR }}
        with:
          client-id: ${{ secrets.AZURE_CAPTURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish once attest and fully verify capture
        run: scripts/ubuntu2404_confidential_capture.sh publish

      - name: Arm fail-closed unconditional cleanup login
        if: always()
        run: rm -f -- "$CLEANUP_LOGIN_MARKER"

      - name: Refresh capture OIDC for unconditional exact cleanup
        id: cleanup_login
        if: always()
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        env:
          AZURE_CONFIG_DIR: ${{ env.AZURE_CONFIG_DIR }}
        with:
          client-id: ${{ secrets.AZURE_CAPTURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record successful fresh cleanup identity
        if: always() && steps.cleanup_login.outcome == 'success'
        run: |
          umask 077
          : >"$CLEANUP_LOGIN_MARKER"

      - name: Clean up only exact allowlisted scratch resources
        if: always()
        run: |
          set -euo pipefail
          if [[ -e "$STATE_FILE" ]]; then
            if [[ ! -f "$CLEANUP_LOGIN_MARKER" ||
                -L "$CLEANUP_LOGIN_MARKER" ]]; then
              echo "::error::Fresh cleanup login failed; retaining quarantined scratch state"
              exit 1
            fi
            scripts/ubuntu2404_confidential_capture.sh cleanup
          fi

      - name: Re-hash sanitized durable capture result
        id: result
        if: success()
        run: |
          set -euo pipefail
          result="$RESULT_DIR/capture-result.json"
          test -f "$result"
          test ! -L "$result"
          test "$(stat -c %a "$result")" = 600
          result_sha256=$(sha256sum "$result" | awk '{print $1}')
          [[ "$result_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "capture_result_sha256=$result_sha256" >>"$GITHUB_OUTPUT"
          echo "Durable capture result SHA-256: \`$result_sha256\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload only sanitized durable capture result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2404-confidential-capture-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}/capture-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove all local source evidence credentials and Azure contexts
        if: always()
        run: rm -rf -- .capture

  publish_provenance:
    name: publish one durable GitHub provenance asset
    needs: [prepare, capture]
    if: >-
      ${{
        github.repository == 'cataggar/miz' &&
        github.ref == 'refs/heads/main' &&
        needs.prepare.result == 'success' &&
        needs.capture.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ubuntu2404-confidential-capture
    permissions:
      actions: read
      contents: write
    env:
      TOOL_COMMIT: ${{ needs.prepare.outputs.tool_commit }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag }}
      TARGET_IMAGE_VERSION: ${{ needs.prepare.outputs.target_gallery_version }}
      PROVENANCE_RELEASE_TAG: ${{ needs.prepare.outputs.provenance_release_tag }}
      PROVENANCE_RELEASE_TITLE: ${{ needs.prepare.outputs.provenance_release_title }}
      PROVENANCE_ASSET_NAME: ${{ needs.prepare.outputs.provenance_asset_name }}
      EXPECTED_RESULT_SHA256: ${{ needs.capture.outputs.capture_result_sha256 }}
      RESULT_DIR: ${{ github.workspace }}/.capture/publication/result
      STAGING_DIR: ${{ github.workspace }}/.capture/publication/staging
      VALIDATION_DIR: ${{ github.workspace }}/.capture/publication/validation
      RELEASE_TOOL: ${{ github.workspace }}/zig-out/bin/ubuntu2404_confidential_release
      TARGET_LOCATION: ${{ vars.AZURE_LOCATION }}
      TARGET_RESOURCE_GROUP: ${{ vars.TARGET_RESOURCE_GROUP }}
      TARGET_GALLERY: ${{ vars.TARGET_GALLERY }}
      TARGET_IMAGE_DEFINITION: ${{ vars.TARGET_IMAGE_DEFINITION }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out immutable publication verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.tool_commit }}
          persist-credentials: false

      - name: Download exact named durable result artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ubuntu2404-confidential-capture-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build strict durable publication verifier
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.capture/zig-global-cache
          bash scripts/zig_fetch_retry.sh --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build -Doptimize=ReleaseSafe install-ubuntu2404-confidential-release
          test -x "$RELEASE_TOOL"

      - name: Validate exact protected result before GitHub publication
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = cataggar/miz
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$TOOL_COMMIT"
          [[ "$EXPECTED_RESULT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          result="$RESULT_DIR/capture-result.json"
          test "$(find "$RESULT_DIR" -maxdepth 1 -type f | wc -l)" -eq 1
          test -f "$result"
          test ! -L "$result"
          target_definition_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$TARGET_RESOURCE_GROUP/providers/Microsoft.Compute/galleries/$TARGET_GALLERY/images/$TARGET_IMAGE_DEFINITION"
          target_version_id="$target_definition_id/versions/$TARGET_IMAGE_VERSION"
          "$RELEASE_TOOL" verify-capture-publication \
            --result "$result" \
            --expected-result-sha256 "$EXPECTED_RESULT_SHA256" \
            --source-commit "$SOURCE_COMMIT" \
            --source-release-tag "$SOURCE_RELEASE_TAG" \
            --tool-commit "$TOOL_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --location "$TARGET_LOCATION" \
            --definition-id "$target_definition_id" \
            --version-id "$target_version_id"
          mkdir -m 0700 -p "$STAGING_DIR" "$VALIDATION_DIR"
          cp -- "$result" "$STAGING_DIR/$PROVENANCE_ASSET_NAME"
          chmod 0600 "$STAGING_DIR/$PROVENANCE_ASSET_NAME"

      - name: Create validate and publish an exact one-asset release
        run: |
          set -euo pipefail
          umask 077
          direct_tag=$(git ls-remote origin "refs/tags/$PROVENANCE_RELEASE_TAG" | awk 'NR == 1 {print $1}')
          peeled_tag=$(git ls-remote origin "refs/tags/$PROVENANCE_RELEASE_TAG^{}" | awk 'NR == 1 {print $1}')
          test "${peeled_tag:-$direct_tag}" = "$TOOL_COMMIT"
          direct_source=$(git ls-remote origin "refs/tags/$SOURCE_RELEASE_TAG" | awk 'NR == 1 {print $1}')
          peeled_source=$(git ls-remote origin "refs/tags/$SOURCE_RELEASE_TAG^{}" | awk 'NR == 1 {print $1}')
          test "${peeled_source:-$direct_source}" = "$SOURCE_COMMIT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROVENANCE_RELEASE_TAG" \
              >"$VALIDATION_DIR/reused-release.json" \
              2>"$VALIDATION_DIR/reused-release.stderr"; then
            echo "::error::Provenance release already exists; refusing overwrite"
            exit 1
          fi
          grep -Eq 'HTTP 404|Not Found' "$VALIDATION_DIR/reused-release.stderr"
          gh release create "$PROVENANCE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$PROVENANCE_RELEASE_TITLE" \
            --notes "Sanitized durable provenance for Azure Compute Gallery version $TARGET_IMAGE_VERSION."
          gh release upload "$PROVENANCE_RELEASE_TAG" \
            "$STAGING_DIR/$PROVENANCE_ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY"
          release_json="$VALIDATION_DIR/draft-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROVENANCE_RELEASE_TAG" \
            >"$release_json"
          jq -e \
            --arg tag "$PROVENANCE_RELEASE_TAG" \
            --arg title "$PROVENANCE_RELEASE_TITLE" \
            --arg name "$PROVENANCE_ASSET_NAME" \
            '
            .tag_name == $tag and .name == $title and
            .draft == true and .prerelease == false and
            (.assets | length == 1) and
            .assets[0].name == $name and
            .assets[0].state == "uploaded" and
            (.assets[0].id | type == "number" and . > 0)
            ' "$release_json" >/dev/null
          asset_id=$(jq -er '.assets[0].id' "$release_json")
          downloaded="$VALIDATION_DIR/$PROVENANCE_ASSET_NAME"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -H 'Accept: application/octet-stream' >"$downloaded"
          test "$(sha256sum "$downloaded" | awk '{print $1}')" = "$EXPECTED_RESULT_SHA256"
          target_definition_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$TARGET_RESOURCE_GROUP/providers/Microsoft.Compute/galleries/$TARGET_GALLERY/images/$TARGET_IMAGE_DEFINITION"
          "$RELEASE_TOOL" verify-capture-publication \
            --result "$downloaded" \
            --expected-result-sha256 "$EXPECTED_RESULT_SHA256" \
            --source-commit "$SOURCE_COMMIT" \
            --source-release-tag "$SOURCE_RELEASE_TAG" \
            --tool-commit "$TOOL_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --location "$TARGET_LOCATION" \
            --definition-id "$target_definition_id" \
            --version-id "$target_definition_id/versions/$TARGET_IMAGE_VERSION"
          gh release edit "$PROVENANCE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROVENANCE_RELEASE_TAG" \
            >"$VALIDATION_DIR/published-release.json"
          jq -e \
            --arg tag "$PROVENANCE_RELEASE_TAG" \
            --arg title "$PROVENANCE_RELEASE_TITLE" \
            --arg name "$PROVENANCE_ASSET_NAME" \
            '.tag_name == $tag and .name == $title and
             .draft == false and .prerelease == false and
             (.assets | length == 1) and .assets[0].name == $name' \
            "$VALIDATION_DIR/published-release.json" >/dev/null

      - name: Remove publication staging
        if: always()
        run: rm -rf -- .capture
