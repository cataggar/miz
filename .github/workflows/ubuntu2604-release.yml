# Protected-environment setup required before dispatch:
# - `ubuntu2604-signing`: restrict deployments to `main` and define variables
#   MIZ_AZURE_TENANT_ID, MIZ_AZURE_CLIENT_ID,
#   MIZ_ARTIFACT_SIGNING_ENDPOINT, MIZ_ARTIFACT_SIGNING_ACCOUNT, and
#   MIZ_ARTIFACT_SIGNING_PROFILE. The signing app's Entra federated credential
#   subject is `repo:cataggar/miz:environment:ubuntu2604-signing`.
# - `ubuntu2604-release`: restrict deployments to `main`, define secrets
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, and
#   variables AZURE_LOCATION_X64, AZURE_LOCATION_ARM64, AZURE_VM_SIZE_X64, and
#   AZURE_VM_SIZE_ARM64. The acceptance app's Entra federated credential subject
#   is `repo:cataggar/miz:environment:ubuntu2604-release`.
# Before dispatch, create or retarget RELEASE_TAG to the exact current `main`
# commit. The workflow accepts lightweight or annotated tags and publishes
# exactly the four full/core QCOW2 assets declared below.
name: Publish Ubuntu 26.04 images

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed Ubuntu release run whose successful candidates should be reused
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ubuntu2604-release-20260829
  cancel-in-progress: false

env:
  RELEASE_TAG: Ubuntu-26.04-20260829
  RELEASE_TITLE: Ubuntu 26.04 full and core - 20260829

jobs:
  prepare:
    name: resolve immutable main source
    if: github.repository == 'cataggar/miz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      candidate_run_id: ${{ steps.source.outputs.candidate_run_id }}
      reuse_candidates: ${{ steps.source.outputs.reuse_candidates }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind release to source commit and candidate run
        id: source
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$CANDIDATE_RUN_ID" ]]; then
            commit=$(git rev-parse HEAD)
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse origin/main)" = "$commit"
            candidate_run_id=$GITHUB_RUN_ID
            reuse_candidates=false
          else
            [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test "$CANDIDATE_RUN_ID" != "$GITHUB_RUN_ID"

            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")
            test "$(jq -r .repository.full_name <<<"$run")" = "$GITHUB_REPOSITORY"
            test "$(jq -r .path <<<"$run")" = ".github/workflows/ubuntu2604-release.yml"
            test "$(jq -r .event <<<"$run")" = workflow_dispatch
            test "$(jq -r .head_branch <<<"$run")" = main
            test "$(jq -r .status <<<"$run")" = completed
            commit=$(jq -r .head_sha <<<"$run")
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]

            candidate_run_id=$CANDIDATE_RUN_ID
            reuse_candidates=true
          fi

          test "$(git ls-remote origin "refs/heads/main" | awk '{print $1}')" = "$commit"
          direct_tag=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          peeled_tag=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')
          tag_commit=${peeled_tag:-$direct_tag}
          test "$tag_commit" = "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$candidate_run_id" >> "$GITHUB_OUTPUT"
          echo "reuse_candidates=$reuse_candidates" >> "$GITHUB_OUTPUT"
          echo "Accepted source commit: \`$commit\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate run: \`$candidate_run_id\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build/native ${{ matrix.key }}
    needs: prepare
    if: needs.prepare.outputs.reuse_candidates != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    environment: ubuntu2604-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - key: x86_64-full
            architecture: x86_64
            flavor: full
            runner: ubuntu-24.04
            asset_name: Ubuntu-26.04-x86_64.qcow2
            virtual_size: 5368709120
            virtual_size_label: 5 GiB
          - key: aarch64-full
            architecture: aarch64
            flavor: full
            runner: ubuntu-24.04-arm
            asset_name: Ubuntu-26.04-aarch64.qcow2
            virtual_size: 5368709120
            virtual_size_label: 5 GiB
          - key: x86_64-core
            architecture: x86_64
            flavor: core
            runner: ubuntu-24.04
            asset_name: Ubuntu-26.04-x86_64.core.qcow2
            virtual_size: 3758096384
            virtual_size_label: 3584 MiB
          - key: aarch64-core
            architecture: aarch64
            flavor: core
            runner: ubuntu-24.04-arm
            asset_name: Ubuntu-26.04-aarch64.core.qcow2
            virtual_size: 3758096384
            virtual_size_label: 3584 MiB
    env:
      CANDIDATE_KEY: ${{ matrix.key }}
      ARCHITECTURE: ${{ matrix.architecture }}
      FLAVOR: ${{ matrix.flavor }}
      ASSET_NAME: ${{ matrix.asset_name }}
      VIRTUAL_SIZE: ${{ matrix.virtual_size }}
      VIRTUAL_SIZE_LABEL: ${{ matrix.virtual_size_label }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      WORK_DIR: .scratch/ubuntu2604-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.key }}
      BUNDLE_DIR: artifact-staging/candidates/${{ matrix.key }}
      RELEASE_TOOL: ${{ github.workspace }}/zig-out/bin/ubuntu2604_release
      SIGNING_PROBE_DIR: ${{ github.workspace }}/signing-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.key }}
      UKI_SIGN_COMMAND: ${{ github.workspace }}/zig-out/bin/miz
      MIZ_AZURE_TENANT_ID: ${{ vars.MIZ_AZURE_TENANT_ID }}
      MIZ_AZURE_CLIENT_ID: ${{ vars.MIZ_AZURE_CLIENT_ID }}
      MIZ_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.MIZ_ARTIFACT_SIGNING_ENDPOINT }}
      MIZ_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.MIZ_ARTIFACT_SIGNING_ACCOUNT }}
      MIZ_ARTIFACT_SIGNING_PROFILE: ${{ vars.MIZ_ARTIFACT_SIGNING_PROFILE }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install complete Ubuntu image-builder dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(
            file jq systemd-boot-efi
          )
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          case "$ARCHITECTURE" in
            x86_64) uki_stub=/usr/lib/systemd/boot/efi/linuxx64.efi.stub ;;
            aarch64) uki_stub=/usr/lib/systemd/boot/efi/linuxaa64.efi.stub ;;
            *) echo "unsupported architecture: $ARCHITECTURE" >&2; exit 1 ;;
          esac
          test -f "$uki_stub"

      - name: Build built-in Artifact Signing client
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          zig build install-miz install-ubuntu2604-release
          test -x "$UKI_SIGN_COMMAND"
          test -x "$RELEASE_TOOL"

      - name: Resolve protected signing certificate
        run: |
          set -euo pipefail
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$MIZ_AZURE_TENANT_ID" =~ $uuid ]]
          [[ "$MIZ_AZURE_CLIENT_ID" =~ $uuid ]]
          [[ "$MIZ_ARTIFACT_SIGNING_ENDPOINT" =~ ^https://[a-z0-9.-]+\.codesigning\.azure\.net/?$ ]]
          [[ "$MIZ_ARTIFACT_SIGNING_ACCOUNT" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          [[ "$MIZ_ARTIFACT_SIGNING_PROFILE" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          certificate="$RUNNER_TEMP/miz-uki-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CANDIDATE_KEY}.pem"
          umask 077
          "$UKI_SIGN_COMMAND" sign certificate "$certificate"
          actual=$("$UKI_SIGN_COMMAND" uki fingerprint "$certificate")
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]]
          echo "UKI_SIGNING_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
          echo "UKI_SIGNING_CERTIFICATE_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Prove protected signing before the image build
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          case "$ARCHITECTURE" in
            x86_64) target=x86_64-uefi ;;
            aarch64) target=aarch64-uefi ;;
            *) exit 1 ;;
          esac
          scratch="$SIGNING_PROBE_DIR"
          mkdir -m 0700 "$scratch"
          unsigned="$scratch/unsigned.efi"
          signed="$scratch/signed.efi"
          metadata="$scratch/metadata.json"
          cp "$UKI_SIGNING_CERTIFICATE" "$scratch/certificate.pem"
          zig build-exe -target "$target" tests/efi_signing_probe.zig -femit-bin="$unsigned"
          export MIZ_UKI_UNSIGNED="$unsigned"
          export MIZ_UKI_SIGNED="$signed"
          export MIZ_UKI_CERTIFICATE="$UKI_SIGNING_CERTIFICATE"
          export MIZ_UKI_ARCHITECTURE="$ARCHITECTURE"
          export MIZ_UKI_FLAVOR="$FLAVOR"
          export MIZ_UKI_SIGNING_METADATA="$metadata"
          MIZ_UKI_UNSIGNED_SHA256=$(sha256sum "$unsigned" | awk '{print $1}')
          export MIZ_UKI_UNSIGNED_SHA256
          export MIZ_UKI_CERTIFICATE_SHA256="$UKI_SIGNING_CERTIFICATE_SHA256"
          "$UKI_SIGN_COMMAND" sign
          test -s "$signed"
          test -s "$metadata"
          "$UKI_SIGN_COMMAND" uki verify --certificate "$UKI_SIGNING_CERTIFICATE" "$signed"
          rm -rf -- "$scratch"

      - name: Upload failed signing probe
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-signing-probe-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.SIGNING_PROBE_DIR }}/
          if-no-files-found: error
          retention-days: 1

      - name: Record host filesystem capacity before image build
        continue-on-error: true
        run: |
          df -hT -- "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Build exact finalized Ubuntu QCOW2
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          rm -rf -- "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR/internal-provenance"
          mkdir -p "$GITHUB_WORKSPACE/$WORK_DIR"
          build_log="$GITHUB_WORKSPACE/$WORK_DIR/build.log"
          sudo -E "$(command -v zig)" build \
            -Dubuntu2604-arch="$ARCHITECTURE" \
            -Dubuntu2604-flavor="$FLAVOR" \
            generalized-ubuntu2604 -- \
            --work-dir "$GITHUB_WORKSPACE/$WORK_DIR" \
            --provenance-dir "$GITHUB_WORKSPACE/$BUNDLE_DIR/internal-provenance" \
            --output "$GITHUB_WORKSPACE/$BUNDLE_DIR/$ASSET_NAME" \
            --size "$VIRTUAL_SIZE" \
            --uki-signing-certificate "$UKI_SIGNING_CERTIFICATE" \
            --uki-signing-certificate-sha256 "$UKI_SIGNING_CERTIFICATE_SHA256" \
            --uki-sign-command "$UKI_SIGN_COMMAND" \
            --uki-sign-command-arg sign \
            2>&1 | tee "$build_log"
          sudo chown -R "$(id -u):$(id -g)" "$WORK_DIR" "$BUNDLE_DIR"
          cp "$build_log" "$BUNDLE_DIR/internal-provenance/build.log"

      - name: Validate standalone zstd QCOW2 and exact flavor size
        run: |
          set -euo pipefail
          asset="$BUNDLE_DIR/$ASSET_NAME"
          miz="$GITHUB_WORKSPACE/zig-out/bin/miz"
          test -f "$asset"
          test -x "$miz"
          test -x "$RELEASE_TOOL"
          # Native validation and metadata: miz replaces the external image
          # tool as both the QCOW2 integrity check and the info publication
          # input (issue #476). The compressed release image is emitted by
          # miz.qcow2 natively, so the production build no longer depends on
          # any external qemu tooling.
          "$miz" check "$asset"
          "$miz" info --output=json "$asset" > "$BUNDLE_DIR/internal-provenance/image-info.json"
          "$RELEASE_TOOL" verify-image-info \
            --info "$BUNDLE_DIR/internal-provenance/image-info.json" \
            --virtual-size "$VIRTUAL_SIZE" \
            --virtual-size-label "$VIRTUAL_SIZE_LABEL"
          digest=$(sha256sum "$asset" | awk '{print $1}')
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > "$BUNDLE_DIR/internal-provenance/build-validated-digest"

      - name: Verify the reproducible size inventory
        run: |
          set -euo pipefail
          # Issue #677 step 1: the build measures where every byte of the image
          # came from, and the measurement is re-validated here rather than
          # trusted, so a malformed or incomplete inventory fails the build
          # that produced it.
          inventory="$BUNDLE_DIR/internal-provenance/ubuntu2604-size-inventory-$FLAVOR-$ARCHITECTURE.json"
          test -f "$inventory"
          test -x "$RELEASE_TOOL"
          # Issue #677 step 3: core is assembled from an exact closure, so every
          # file it carries is package-owned or named by the explicit
          # injected-file allowlist and any remainder fails the candidate. The
          # full flavor inherits Canonical's server root, which is measured
          # rather than gated.
          gate=()
          if [ "$FLAVOR" = core ]; then
            gate=(--max-unexpected-unowned 0)
          fi
          measured=$("$RELEASE_TOOL" size-inventory-verify \
            --report "$inventory" \
            --architecture "$ARCHITECTURE" \
            --flavor "$FLAVOR" \
            --require-phase root_build,image_build,publication \
            "${gate[@]}")
          printf 'Size inventory `%s`: `%s`\n' "$CANDIDATE_KEY" "$measured" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the explicit runtime contract
        if: matrix.flavor == 'core'
        run: |
          set -euo pipefail
          # Issue #677 step 2: the core appliance publishes what it needs, and
          # the published statement is re-checked here against the contract the
          # accepted source compiles, so a candidate can never ship a promise
          # its own tooling no longer makes.
          contract="$BUNDLE_DIR/internal-provenance/ubuntu2604-runtime-contract-$FLAVOR-$ARCHITECTURE.json"
          test -f "$contract"
          test -x "$RELEASE_TOOL"
          declared=$("$RELEASE_TOOL" runtime-contract-verify \
            --contract "$contract" \
            --architecture "$ARCHITECTURE" \
            --flavor "$FLAVOR")
          printf 'Runtime contract `%s`: `%s`\n' "$CANDIDATE_KEY" "$declared" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Create and verify exact candidate bundle
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          validated=$(<"$BUNDLE_DIR/internal-provenance/build-validated-digest")
          "$RELEASE_TOOL" candidate \
            --key "$CANDIDATE_KEY" \
            --architecture "$ARCHITECTURE" \
            --flavor "$FLAVOR" \
            --asset "$BUNDLE_DIR/$ASSET_NAME" \
            --validated-sha256 "$validated" \
            --virtual-size "$VIRTUAL_SIZE" \
            --source-commit "$SOURCE_COMMIT" \
            --provenance-dir "$BUNDLE_DIR/internal-provenance" \
            --runner "$RUNNER_NAME_VALUE" \
            --run-id "$RUN_ID_VALUE" \
            --run-attempt "$RUN_ATTEMPT_VALUE" \
            --output "$BUNDLE_DIR/candidate.json"
          "$RELEASE_TOOL" verify-candidate \
            --manifest "$BUNDLE_DIR/candidate.json" \
            --asset "$BUNDLE_DIR/$ASSET_NAME" \
            --key "$CANDIDATE_KEY" \
            --source-commit "$SOURCE_COMMIT"

      - name: Upload exact validated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-candidate-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.BUNDLE_DIR }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Diagnose storage after image build failure
        if: failure()
        continue-on-error: true
        run: |
          echo "::group::Host filesystem capacity after failure"
          df -hT -- "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          echo "::endgroup::"
          echo "::group::Largest build paths after failure"
          sudo -n du -x -h --max-depth=1 \
            "$GITHUB_WORKSPACE/$WORK_DIR" \
            "$GITHUB_WORKSPACE/$BUNDLE_DIR" \
            "$GITHUB_WORKSPACE/.zig-global-cache" \
            2>/dev/null | sort -h | tail -n 30
          echo "::endgroup::"

      - name: Clean privileged build state
        if: always()
        run: |
          # Reliably remove root-owned build state and signing material even if
          # an earlier removal fails, and surface any cleanup failure via a
          # non-zero exit. This runs in its own always() step, so it never masks
          # the original build failure recorded on the build steps above.
          set -uo pipefail
          status=0
          sudo rm -rf -- "$WORK_DIR" "$BUNDLE_DIR" || status=1
          rm -rf -- "$SIGNING_PROBE_DIR" || status=1
          rm -f -- "${UKI_SIGNING_CERTIFICATE:-}" || status=1
          exit "$status"

  # This job is downstream of the complete build matrix, so it is rerun when a
  # failed build is retried while the successful prepare output is retained.
  resolve_candidates:
    name: resolve exact candidate artifacts
    needs: [prepare, build]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (
          needs.build.result == 'success' ||
          (
            needs.prepare.outputs.reuse_candidates == 'true' &&
            needs.build.result == 'skipped'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      selection: ${{ steps.resolve.outputs.selection }}
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
      RELEASE_TOOL: ${{ github.workspace }}/zig-out/bin/ubuntu2604_release
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build accepted-source release tooling
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          bash scripts/zig_fetch_retry.sh \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build -Doptimize=ReleaseSafe install-ubuntu2604-release
          test -x "$RELEASE_TOOL"

      - name: Resolve per-key candidate attempts
        id: resolve
        run: |
          set -euo pipefail
          selection=.release/candidate-selection.json
          mkdir -p -- "$(dirname -- "$selection")"
          bash scripts/ubuntu2604_resolve_artifacts.sh \
            candidate "$CANDIDATE_RUN_ID" "$SOURCE_COMMIT" "$selection"
          echo "selection=$(jq -c . "$selection")" >> "$GITHUB_OUTPUT"

  native_qemu:
    name: same-architecture QEMU (${{ matrix.accelerator }}) ${{ matrix.key }}
    needs: [prepare, resolve_candidates]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.resolve_candidates.result == 'success'
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - key: x86_64-full
            architecture: x86_64
            flavor: full
            runner: ubuntu-24.04
            runner_architecture: x86_64
            debian_architecture: amd64
            accelerator: kvm
            accelerator_argument: kvm
            emulator: /usr/bin/qemu-system-x86_64
            machine: q35
            cpu: host
            timeout_minutes: 180
            asset_name: Ubuntu-26.04-x86_64.qcow2
          - key: aarch64-full
            architecture: aarch64
            flavor: full
            runner: ubuntu-24.04-arm
            runner_architecture: aarch64
            debian_architecture: arm64
            accelerator: tcg
            accelerator_argument: tcg,thread=multi
            emulator: /usr/bin/qemu-system-aarch64
            machine: virt
            cpu: max
            timeout_minutes: 360
            asset_name: Ubuntu-26.04-aarch64.qcow2
          - key: x86_64-core
            architecture: x86_64
            flavor: core
            runner: ubuntu-24.04
            runner_architecture: x86_64
            debian_architecture: amd64
            accelerator: kvm
            accelerator_argument: kvm
            emulator: /usr/bin/qemu-system-x86_64
            machine: q35
            cpu: host
            timeout_minutes: 180
            asset_name: Ubuntu-26.04-x86_64.core.qcow2
          - key: aarch64-core
            architecture: aarch64
            flavor: core
            runner: ubuntu-24.04-arm
            runner_architecture: aarch64
            debian_architecture: arm64
            accelerator: tcg
            accelerator_argument: tcg,thread=multi
            emulator: /usr/bin/qemu-system-aarch64
            machine: virt
            cpu: max
            timeout_minutes: 360
            asset_name: Ubuntu-26.04-aarch64.core.qcow2
    env:
      CANDIDATE_KEY: ${{ matrix.key }}
      ARCHITECTURE: ${{ matrix.architecture }}
      FLAVOR: ${{ matrix.flavor }}
      ASSET_NAME: ${{ matrix.asset_name }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
      CANDIDATE_RUN_ATTEMPT: ${{ fromJSON(needs.resolve_candidates.outputs.selection).artifacts[matrix.key].run_attempt }}
      CANDIDATE_DIR: .release/native/${{ matrix.key }}/candidate
      RESULT_DIR: artifact-staging/native-results/${{ matrix.key }}
      RELEASE_TOOL: ${{ github.workspace }}/zig-out/bin/ubuntu2604_release
      MIZ_UBUNTU2604_QEMU: ${{ matrix.emulator }}
      MIZ_UBUNTU2604_QEMU_ACCELERATOR: ${{ matrix.accelerator }}
      MIZ_UBUNTU2604_QEMU_ACCELERATOR_ARGUMENT: ${{ matrix.accelerator_argument }}
      MIZ_UBUNTU2604_QEMU_CPU: ${{ matrix.cpu }}
      MIZ_UBUNTU2604_QEMU_MACHINE: ${{ matrix.machine }}
      MIZ_UBUNTU2604_QEMU_JOB_TIMEOUT_MINUTES: ${{ matrix.timeout_minutes }}
      MIZ_UBUNTU2604_RUNNER_ARCHITECTURE: ${{ matrix.runner_architecture }}
    steps:
      - name: Require x86_64 KVM runner
        if: matrix.architecture == 'x86_64'
        run: |
          set -euo pipefail
          test "$MIZ_UBUNTU2604_QEMU_ACCELERATOR" = kvm
          test "$MIZ_UBUNTU2604_QEMU_ACCELERATOR_ARGUMENT" = kvm
          test "$MIZ_UBUNTU2604_QEMU_CPU" = host
          test "$MIZ_UBUNTU2604_QEMU_MACHINE" = q35
          test "$MIZ_UBUNTU2604_QEMU_JOB_TIMEOUT_MINUTES" = 180
          test "$MIZ_UBUNTU2604_QEMU" = /usr/bin/qemu-system-x86_64
          test "$MIZ_UBUNTU2604_RUNNER_ARCHITECTURE" = x86_64
          test "${{ matrix.debian_architecture }}" = amd64
          case "$ARCHITECTURE" in
            x86_64)
              expected_uname=x86_64
              expected_deb=amd64
              ;;
            *)
              echo "::error::KVM acceptance is restricted to x86_64, got $ARCHITECTURE"
              exit 1
              ;;
          esac
          source /etc/os-release
          test "${ID:-}" = ubuntu
          test "$(uname -m)" = "$expected_uname"
          test "$(dpkg --print-architecture)" = "$expected_deb"
          sudo -n true
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::x86_64 QEMU acceptance requires a KVM-capable runner with /dev/kvm"
            exit 1
          fi
          sudo -n chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Require hosted Arm64 TCG runner
        if: matrix.architecture == 'aarch64'
        run: |
          set -euo pipefail
          test "$ARCHITECTURE" = aarch64
          test "$MIZ_UBUNTU2604_QEMU_ACCELERATOR" = tcg
          test "$MIZ_UBUNTU2604_QEMU_ACCELERATOR_ARGUMENT" = tcg,thread=multi
          test "$MIZ_UBUNTU2604_QEMU_CPU" = max
          test "$MIZ_UBUNTU2604_QEMU_MACHINE" = virt
          test "$MIZ_UBUNTU2604_QEMU_JOB_TIMEOUT_MINUTES" = 360
          test "$MIZ_UBUNTU2604_QEMU" = /usr/bin/qemu-system-aarch64
          test "$MIZ_UBUNTU2604_RUNNER_ARCHITECTURE" = aarch64
          test "${{ matrix.debian_architecture }}" = arm64
          source /etc/os-release
          test "${ID:-}" = ubuntu
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          sudo -n true

      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download exact build-validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ fromJSON(needs.resolve_candidates.outputs.selection).artifacts[matrix.key].artifact_id }}
          path: ${{ env.CANDIDATE_DIR }}
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install same-architecture QEMU, firmware, and vTPM tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(
            ca-certificates openssh-client openssl qemu-utils
            sbsigntool swtpm swtpm-tools
          )
          case "$ARCHITECTURE" in
            x86_64)
              packages+=(ovmf qemu-system-x86)
              qemu=qemu-system-x86_64
              uefi_code=/usr/share/OVMF/OVMF_CODE_4M.ms.fd
              uefi_vars=/usr/share/OVMF/OVMF_VARS_4M.ms.fd
              ;;
            aarch64)
              packages+=(qemu-efi-aarch64 qemu-system-arm)
              qemu=qemu-system-aarch64
              uefi_code=/usr/share/AAVMF/AAVMF_CODE.ms.fd
              uefi_vars=/usr/share/AAVMF/AAVMF_VARS.ms.fd
              ;;
            *)
              echo "::error::Unsupported QEMU acceptance architecture: $ARCHITECTURE"
              exit 1
              ;;
          esac
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          uefi_code=$(readlink -f -- "$uefi_code")
          uefi_vars=$(readlink -f -- "$uefi_vars")
          test -f "$uefi_code"
          test -f "$uefi_vars"
          test -r "$uefi_code"
          test -r "$uefi_vars"
          {
            echo "MIZ_UBUNTU2604_UEFI_CODE=$uefi_code"
            echo "MIZ_UBUNTU2604_UEFI_VARS=$uefi_vars"
          } >> "$GITHUB_ENV"
          for tool in qemu-img sbverify ssh ssh-keygen swtpm; do
            command -v "$tool" >/dev/null
          done
          test "$(command -v "$qemu")" = "$MIZ_UBUNTU2604_QEMU"

      - name: Build accepted-source release tooling
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          bash scripts/zig_fetch_retry.sh \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build install-ubuntu2604-release
          test -x "$RELEASE_TOOL"

      # The x86_64 runner's /dev/kvm was proven present and writable before
      # checkout. The condition excludes Arm TCG entirely; this then proves
      # the x86 device speaks the stable KVM ABI using accepted-source tooling.
      - name: Require the stable KVM API version
        if: matrix.architecture == 'x86_64'
        run: |
          set -euo pipefail
          "$RELEASE_TOOL" kvm-api-version

      - name: Provision privileged offline-root containment fixture
        run: |
          set -euo pipefail
          fixture=.scratch/offline-root-integration-root
          trap 'sudo rm -rf -- "$fixture"' EXIT
          sudo rm -rf -- "$fixture"
          sudo mkdir -p -- "$fixture"/{bin,usr/bin,lib64,dev,proc,sys,run,tmp,etc}
          sudo cp /bin/bash "$fixture/bin/bash"
          sudo ln -s bash "$fixture/bin/sh"
          sleep_bin=$(readlink -f /usr/bin/sleep)
          test -x "$sleep_bin"
          sudo cp "$sleep_bin" "$fixture/usr/bin/sleep"
          for binary in /bin/bash "$sleep_bin"; do
            sudo cp --parents "$binary" "$fixture"
            while read -r library; do
              [[ -z "$library" ]] || sudo cp --parents "$library" "$fixture"
            done < <(ldd "$binary" | sed -nE 's/.*=>[[:space:]]*(\/[^ ]+).*/\1/p; s/^[[:space:]]*(\/[^ ]+)[[:space:]].*/\1/p')
          done
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          sudo -E "$(command -v zig)" test packages/miz/src/offline_root.zig \
            --test-filter "privileged offline namespace"
          sudo chown -R "$(id -u):$(id -g)" .zig-cache .zig-global-cache 2>/dev/null || true

      - name: Verify candidate and bind QEMU acceptance inputs
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          asset="$CANDIDATE_DIR/$ASSET_NAME"
          manifest="$CANDIDATE_DIR/candidate.json"
          test -x "$RELEASE_TOOL"
          "$RELEASE_TOOL" verify-candidate \
            --manifest "$manifest" \
            --asset "$asset" \
            --key "$CANDIDATE_KEY" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT"
          "$RELEASE_TOOL" candidate-signing-env \
            --manifest "$manifest" \
            --certificate "$RESULT_DIR/signing-certificate.der" \
            --github-env "$GITHUB_ENV" >/dev/null
          openssl x509 -inform DER \
            -in "$RESULT_DIR/signing-certificate.der" \
            -out "$RESULT_DIR/signing-certificate.pem"
          echo "MIZ_UBUNTU2604_IMAGE=$GITHUB_WORKSPACE/$asset" >> "$GITHUB_ENV"
          echo "MIZ_UBUNTU2604_SIGNING_CERTIFICATE=$GITHUB_WORKSPACE/$RESULT_DIR/signing-certificate.pem" >> "$GITHUB_ENV"
          echo "MIZ_UBUNTU2604_ACCEPTANCE_RESULT=$GITHUB_WORKSPACE/$RESULT_DIR/native-result.json" >> "$GITHUB_ENV"
          # Issue #677 step 1 left the `first_boot` phase for the stage that
          # actually boots the image; core acceptance is that stage. The bound
          # inventory is only ever read -- its digest is part of build
          # provenance -- and the measured phase is appended to a separate
          # document beside the result.
          if [[ "$FLAVOR" == core ]]; then
            inventory="$CANDIDATE_DIR/internal-provenance/ubuntu2604-size-inventory-$FLAVOR-$ARCHITECTURE.json"
            test -f "$inventory"
            echo "MIZ_UBUNTU2604_SIZE_INVENTORY=$GITHUB_WORKSPACE/$inventory" >> "$GITHUB_ENV"
            echo "MIZ_UBUNTU2604_FIRST_BOOT_INVENTORY=$GITHUB_WORKSPACE/$RESULT_DIR/ubuntu2604-size-inventory-$FLAVOR-$ARCHITECTURE.first-boot.json" >> "$GITHUB_ENV"
          fi
          echo "MIZ_UBUNTU2604_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "MIZ_UBUNTU2604_CANDIDATE_RUN_ID=$CANDIDATE_RUN_ID" >> "$GITHUB_ENV"
          echo "MIZ_UBUNTU2604_CANDIDATE_RUN_ATTEMPT=$CANDIDATE_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "MIZ_UBUNTU2604_ACCEPTANCE_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "MIZ_UBUNTU2604_ACCEPTANCE_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Run same-architecture Secure Boot QEMU acceptance
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          bash scripts/zig_fetch_retry.sh \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build \
            -Dubuntu2604-arch="$ARCHITECTURE" \
            -Dubuntu2604-flavor="$FLAVOR" \
            test-ubuntu2604-acceptance
          test -s "$MIZ_UBUNTU2604_ACCEPTANCE_RESULT"

      - name: Validate exact QEMU acceptance evidence
        run: |
          set -euo pipefail
          "$RELEASE_TOOL" verify-native-result \
            --manifest "$CANDIDATE_DIR/candidate.json" \
            --asset "$CANDIDATE_DIR/$ASSET_NAME" \
            --result "$RESULT_DIR/native-result.json" \
            --key "$CANDIDATE_KEY" \
            --source-commit "$SOURCE_COMMIT"

      - name: Verify the measured first-boot size inventory
        if: matrix.flavor == 'core'
        run: |
          set -euo pipefail
          # The acceptance harness measured the booted guest's own ext4
          # accounting; it is re-validated here, requiring the phase that only a
          # boot can produce, so an unbooted or partial measurement cannot pass.
          first_boot="$RESULT_DIR/ubuntu2604-size-inventory-$FLAVOR-$ARCHITECTURE.first-boot.json"
          test -f "$first_boot"
          test -x "$RELEASE_TOOL"
          measured=$("$RELEASE_TOOL" size-inventory-verify \
            --report "$first_boot" \
            --architecture "$ARCHITECTURE" \
            --flavor "$FLAVOR" \
            --require-phase root_build,image_build,publication,first_boot \
            --max-unexpected-unowned 0)
          printf 'First-boot size inventory `%s`: `%s`\n' "$CANDIDATE_KEY" "$measured" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QEMU acceptance failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-native-failure-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload exact QEMU acceptance result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-native-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ env.RESULT_DIR }}/native-result.json
            ${{ env.RESULT_DIR }}/*.first-boot.json
          if-no-files-found: error
          retention-days: 2

      - name: Remove candidate and local acceptance state
        if: always()
        run: |
          set -uo pipefail
          status=0
          rm -rf -- ".release/native/$CANDIDATE_KEY" || status=1
          rm -rf -- "$RESULT_DIR" || status=1
          exit "$status"

  azure_acceptance:
    name: Azure ${{ matrix.key }}
    needs: [prepare, resolve_candidates]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.resolve_candidates.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: ubuntu2604-release
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - key: x86_64-full
            architecture: x86_64
            flavor: full
            asset_name: Ubuntu-26.04-x86_64.qcow2
            location_variable: AZURE_LOCATION_X64
            size_variable: AZURE_VM_SIZE_X64
          - key: aarch64-full
            architecture: aarch64
            flavor: full
            asset_name: Ubuntu-26.04-aarch64.qcow2
            location_variable: AZURE_LOCATION_ARM64
            size_variable: AZURE_VM_SIZE_ARM64
          - key: x86_64-core
            architecture: x86_64
            flavor: core
            asset_name: Ubuntu-26.04-x86_64.core.qcow2
            location_variable: AZURE_LOCATION_X64
            size_variable: AZURE_VM_SIZE_X64
          - key: aarch64-core
            architecture: aarch64
            flavor: core
            asset_name: Ubuntu-26.04-aarch64.core.qcow2
            location_variable: AZURE_LOCATION_ARM64
            size_variable: AZURE_VM_SIZE_ARM64
    env:
      CANDIDATE_KEY: ${{ matrix.key }}
      ARCHITECTURE: ${{ matrix.architecture }}
      FLAVOR: ${{ matrix.flavor }}
      ASSET_NAME: ${{ matrix.asset_name }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
      CANDIDATE_RUN_ATTEMPT: ${{ fromJSON(needs.resolve_candidates.outputs.selection).artifacts[matrix.key].run_attempt }}
      CANDIDATE_DIR: .release/azure/${{ matrix.key }}/candidate
      RESULT_DIR: artifact-staging/azure-results/${{ matrix.key }}
      RELEASE_TOOL: ${{ github.workspace }}/zig-out/bin/ubuntu2604_release
      STATE_FILE: .release/azure/${{ matrix.key }}/resource-group
      AZURE_LOCATION: ${{ vars[matrix.location_variable] }}
      AZURE_VM_SIZE: ${{ vars[matrix.size_variable] }}
      BINDER_PROBE: ${{ github.workspace }}/zig-out/bin/binder-probe-${{ matrix.key }}
      RUNTIME_CONTRACT_PROBE: ${{ github.workspace }}/zig-out/bin/ubuntu2604-runtime-contract-probe-${{ matrix.architecture }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download exact build-validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ fromJSON(needs.resolve_candidates.outputs.selection).artifacts[matrix.key].artifact_id }}
          path: ${{ env.CANDIDATE_DIR }}
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}

      - name: Fail closed on missing protected configuration
        env:
          AZURE_CLIENT_ID_VALUE: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID_VALUE: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID_VALUE: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$AZURE_CLIENT_ID_VALUE" =~ $uuid ]]
          [[ "$AZURE_TENANT_ID_VALUE" =~ $uuid ]]
          [[ "$AZURE_SUBSCRIPTION_ID_VALUE" =~ $uuid ]]
          [[ "$AZURE_LOCATION" =~ ^[a-z0-9-]+$ ]]
          [[ "$AZURE_VM_SIZE" =~ ^Standard_[A-Za-z0-9_]+$ ]]

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Require Azure acceptance tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client qemu-utils
          for tool in az azcopy qemu-img ssh ssh-keygen timeout; do
            command -v "$tool" >/dev/null
          done
          az version --output json >/dev/null

      - name: Build accepted-source miz
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          bash scripts/zig_fetch_retry.sh \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build -Doptimize=ReleaseSafe
          test -x zig-out/bin/miz

      - name: Build Binder device usability probe
        if: matrix.flavor == 'core'
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          zig build-exe \
            -target "$ARCHITECTURE-linux" \
            -O ReleaseSmall \
            -static \
            tests/binder_probe.zig \
            -femit-bin="$BINDER_PROBE" \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          test -x "$BINDER_PROBE"

      - name: Build the guest runtime contract probe
        if: matrix.flavor == 'core'
        run: |
          set -euo pipefail
          # The probe shares the contract module with the release tooling, so it
          # is built through the build graph rather than an ad hoc build-exe
          # that could compile a different table than the one being enforced.
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          zig build install-ubuntu2604-runtime-contract-probes
          test -x "$RUNTIME_CONTRACT_PROBE"

      - name: Log in to Azure with protected-environment OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run exact-digest Azure Trusted Launch acceptance
        env:
          MIZ: ${{ github.workspace }}/zig-out/bin/miz
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export GITHUB_RUN_ID=$RUN_ID_VALUE
          export GITHUB_RUN_ATTEMPT=$RUN_ATTEMPT_VALUE
          scripts/ubuntu2604_azure_acceptance.sh run

      - name: Refresh Azure OIDC credential for unconditional cleanup
        if: always()
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete only ownership-tagged temporary Azure resources
        if: always()
        env:
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          export GITHUB_RUN_ID=$RUN_ID_VALUE
          export GITHUB_RUN_ATTEMPT=$RUN_ATTEMPT_VALUE
          if [[ -x scripts/ubuntu2604_azure_acceptance.sh ]]; then
            scripts/ubuntu2604_azure_acceptance.sh cleanup
          elif [[ -s "$STATE_FILE" ]]; then
            echo "::error::Cleanup script is absent while Azure state exists"
            exit 1
          fi

      - name: Upload failed Azure acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-azure-failure-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ env.RESULT_DIR }}/*.json
            ${{ env.RESULT_DIR }}/boot.log
            ${{ env.RESULT_DIR }}/boot-screenshot.png
            ${{ env.RESULT_DIR }}/boot-diagnostics-errors.log
            ${{ env.RESULT_DIR }}/uefi-db.bin
          if-no-files-found: warn
          retention-days: 2

      - name: Upload exact Azure acceptance result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-azure-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}/azure-result.json
          if-no-files-found: error
          retention-days: 2

      - name: Remove derived VHD and local credentials
        if: always()
        run: |
          set -uo pipefail
          status=0
          rm -rf -- ".release/azure/$CANDIDATE_KEY" || status=1
          rm -rf -- "$RESULT_DIR" || status=1
          exit "$status"

  publish:
    name: verify complete four-candidate gate and publish
    needs: [prepare, build, resolve_candidates, native_qemu, azure_acceptance]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (
          needs.build.result == 'success' ||
          (
            needs.prepare.outputs.reuse_candidates == 'true' &&
            needs.build.result == 'skipped'
          )
        ) &&
        needs.resolve_candidates.result == 'success' &&
        needs.native_qemu.result == 'success' &&
        needs.azure_acceptance.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ubuntu2604-release
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
      CANDIDATES_DIR: .release/publication/candidates
      NATIVE_RESULTS_DIR: .release/publication/native
      AZURE_RESULTS_DIR: .release/publication/azure
      SELECTIONS_DIR: .release/publication/selections
      STAGING_ROOT: .release/publication/staging
      RELEASE_TOOL: ${{ github.workspace }}/zig-out/bin/ubuntu2604_release
      UBUNTU2604_RELEASE_TOOL: ${{ github.workspace }}/zig-out/bin/ubuntu2604_release
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      BUILD_RESULT: ${{ needs.prepare.outputs.reuse_candidates == 'true' && 'success' || needs.build.result }}
      NATIVE_RESULT: ${{ needs.native_qemu.result }}
      AZURE_RESULT: ${{ needs.azure_acceptance.result }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build accepted-source release tooling
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          bash scripts/zig_fetch_retry.sh \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build -Doptimize=ReleaseSafe install-ubuntu2604-release
          test -x "$RELEASE_TOOL"

      # Resolve again in the publication job itself. A "Re-run failed jobs"
      # operation may rerun only this job, so no successful upstream output is
      # treated as a substitute for inspecting the artifacts that still exist.
      - name: Resolve exact publication inputs
        id: artifacts
        env:
          RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p -- "$SELECTIONS_DIR"
          bash scripts/ubuntu2604_resolve_artifacts.sh \
            candidate "$CANDIDATE_RUN_ID" "$SOURCE_COMMIT" \
            "$SELECTIONS_DIR/candidates.json"
          bash scripts/ubuntu2604_resolve_artifacts.sh \
            native "$RUN_ID_VALUE" "$SOURCE_COMMIT" \
            "$SELECTIONS_DIR/native.json"
          bash scripts/ubuntu2604_resolve_artifacts.sh \
            azure "$RUN_ID_VALUE" "$SOURCE_COMMIT" \
            "$SELECTIONS_DIR/azure.json"
          echo "candidate_ids=$(jq -r '[.artifacts[].artifact_id | tostring] | join(\",\")' "$SELECTIONS_DIR/candidates.json")" >> "$GITHUB_OUTPUT"
          echo "native_ids=$(jq -r '[.artifacts[].artifact_id | tostring] | join(\",\")' "$SELECTIONS_DIR/native.json")" >> "$GITHUB_OUTPUT"
          echo "azure_ids=$(jq -r '[.artifacts[].artifact_id | tostring] | join(\",\")' "$SELECTIONS_DIR/azure.json")" >> "$GITHUB_OUTPUT"

      - name: Download all build-validated candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.artifacts.outputs.candidate_ids }}
          path: ${{ env.CANDIDATES_DIR }}
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}

      - name: Download all accelerator-bound QEMU acceptance results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.artifacts.outputs.native_ids }}
          path: ${{ env.NATIVE_RESULTS_DIR }}
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download all Azure acceptance results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.artifacts.outputs.azure_ids }}
          path: ${{ env.AZURE_RESULTS_DIR }}
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Validate exact four-candidate release gate
        env:
          RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$PREPARE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$AZURE_RESULT" = success
          "$RELEASE_TOOL" release-gate \
            --candidates "$CANDIDATES_DIR" \
            --native-results "$NATIVE_RESULTS_DIR" \
            --azure-results "$AZURE_RESULTS_DIR" \
            --candidate-selection "$SELECTIONS_DIR/candidates.json" \
            --native-selection "$SELECTIONS_DIR/native.json" \
            --azure-selection "$SELECTIONS_DIR/azure.json" \
            --source-commit "$SOURCE_COMMIT" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --run-id "$RUN_ID_VALUE"

      - name: Publish exactly four accepted Ubuntu assets
        run: scripts/ubuntu2604_publish.sh

      - name: Remove publication staging
        if: always()
        run: rm -rf -- .release/publication
