# Protected-environment setup required before dispatch:
# - `ubuntu2604-signing`: restrict deployments to `main` and define variables
#   MIZ_AZURE_TENANT_ID, MIZ_AZURE_CLIENT_ID,
#   MIZ_ARTIFACT_SIGNING_ENDPOINT, MIZ_ARTIFACT_SIGNING_ACCOUNT, and
#   MIZ_ARTIFACT_SIGNING_PROFILE. The signing app's Entra federated credential
#   subject is `repo:cataggar/miz:environment:ubuntu2604-signing`.
# - `ubuntu2604-release`: restrict deployments to `main`, define secrets
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, and
#   variables AZURE_LOCATION_X64, AZURE_LOCATION_ARM64, AZURE_VM_SIZE_X64, and
#   AZURE_VM_SIZE_ARM64. The acceptance app's Entra federated credential subject
#   is `repo:cataggar/miz:environment:ubuntu2604-release`.
# - The Android container boot-completion smoke required by core acceptance
#   reads separate, non-environment-scoped repository secrets so the
#   native-QEMU job (which needs no Azure credential) can use them without a
#   protected-environment gate: ANDROID_SMOKE_X86_64_JSON and
#   ANDROID_SMOKE_AARCH64_JSON. Each exact JSON document supplies one private
#   HTTPS archive location plus the expected archive and provenance SHA-256
#   values for that architecture's external Android runtime and bundle inputs.
#   An optional ANDROID_ARTIFACT_TOKEN secret is used only for private
#   downloads. Missing or malformed input fails explicitly rather than
#   skipping the smoke; only verified local paths and public-safe SHA-256
#   evidence leave the download step.
# This workflow validates core candidates and uploads workflow artifacts. It
# never creates or moves tags, creates a GitHub release, or publishes assets.
name: Validate Ubuntu 26.04 core images

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed core validation run whose successful candidates should be reused
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ubuntu2604-core-validation
  cancel-in-progress: false

jobs:
  prepare:
    name: resolve immutable main source
    if: github.repository == 'cataggar/miz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      candidate_run_id: ${{ steps.source.outputs.candidate_run_id }}
      candidate_run_attempt: ${{ steps.source.outputs.candidate_run_attempt }}
      reuse_candidates: ${{ steps.source.outputs.reuse_candidates }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind validation to source commit and exact candidate attempt
        id: source
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$CANDIDATE_RUN_ID" ]]; then
            commit=$(git rev-parse HEAD)
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse origin/main)" = "$commit"
            candidate_run_id=$GITHUB_RUN_ID
            candidate_run_attempt=$GITHUB_RUN_ATTEMPT
            reuse_candidates=false
          else
            [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test "$CANDIDATE_RUN_ID" != "$GITHUB_RUN_ID"

            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")
            test "$(jq -r .repository.full_name <<<"$run")" = "$GITHUB_REPOSITORY"
            test "$(jq -r .path <<<"$run")" = ".github/workflows/ubuntu2604-core-validation.yml"
            test "$(jq -r .event <<<"$run")" = workflow_dispatch
            test "$(jq -r .head_branch <<<"$run")" = main
            test "$(jq -r .status <<<"$run")" = completed
            commit=$(jq -r .head_sha <<<"$run")
            candidate_run_attempt=$(jq -r .run_attempt <<<"$run")
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            [[ "$candidate_run_attempt" =~ ^[1-9][0-9]*$ ]]

            jobs=$(
              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$candidate_run_attempt/jobs?per_page=100" |
                jq -s '[.[].jobs[]]'
            )
            artifacts=$(
              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" |
                jq -s '[.[].artifacts[]]'
            )
            for key in x86_64-core aarch64-core; do
              test "$(
                jq --arg name "build/native $key" \
                  '[.[] | select(.name == $name and .conclusion == "success")] | length' \
                  <<<"$jobs"
              )" = 1
              artifact="ubuntu2604-core-candidate-$key-$commit-$candidate_run_attempt"
              test "$(
                jq --arg name "$artifact" \
                  '[.[] | select(.name == $name and .expired == false and .size_in_bytes > 0)] | length' \
                  <<<"$artifacts"
              )" = 1
            done
            test "$(
              jq '[.[] | select(
                (.name == "build/native x86_64-core" or
                 .name == "build/native aarch64-core") and
                .conclusion == "success"
              )] | length' <<<"$jobs"
            )" = 2
            test "$(
              jq --arg suffix "-$commit-$candidate_run_attempt" \
                '[.[] | select(
                  (.name | startswith("ubuntu2604-core-candidate-")) and
                  (.name | endswith($suffix)) and
                  .expired == false
                )] | length' <<<"$artifacts"
            )" = 2

            candidate_run_id=$CANDIDATE_RUN_ID
            reuse_candidates=true
          fi

          test "$(git ls-remote origin "refs/heads/main" | awk '{print $1}')" = "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$candidate_run_id" >> "$GITHUB_OUTPUT"
          echo "candidate_run_attempt=$candidate_run_attempt" >> "$GITHUB_OUTPUT"
          echo "reuse_candidates=$reuse_candidates" >> "$GITHUB_OUTPUT"
          echo "Accepted source commit: \`$commit\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate run: \`$candidate_run_id\` attempt \`$candidate_run_attempt\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build/native ${{ matrix.key }}
    needs: prepare
    if: needs.prepare.outputs.reuse_candidates != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    environment: ubuntu2604-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - key: x86_64-core
            architecture: x86_64
            runner: ubuntu-24.04
            asset_name: Ubuntu-26.04-x86_64.core.qcow2
          - key: aarch64-core
            architecture: aarch64
            runner: ubuntu-24.04-arm
            asset_name: Ubuntu-26.04-aarch64.core.qcow2
    env:
      CANDIDATE_KEY: ${{ matrix.key }}
      ARCHITECTURE: ${{ matrix.architecture }}
      FLAVOR: core
      ASSET_NAME: ${{ matrix.asset_name }}
      VIRTUAL_SIZE: 3758096384
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      WORK_DIR: .scratch/ubuntu2604-core-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.key }}
      BUNDLE_DIR: artifact-staging/core-candidates/${{ matrix.key }}
      SIGNING_PROBE_DIR: ${{ github.workspace }}/signing-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.key }}
      UKI_SIGN_COMMAND: ${{ github.workspace }}/zig-out/bin/miz
      MIZ_AZURE_TENANT_ID: ${{ vars.MIZ_AZURE_TENANT_ID }}
      MIZ_AZURE_CLIENT_ID: ${{ vars.MIZ_AZURE_CLIENT_ID }}
      MIZ_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.MIZ_ARTIFACT_SIGNING_ENDPOINT }}
      MIZ_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.MIZ_ARTIFACT_SIGNING_ACCOUNT }}
      MIZ_ARTIFACT_SIGNING_PROFILE: ${{ vars.MIZ_ARTIFACT_SIGNING_PROFILE }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install complete Ubuntu image-builder dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(
            file jq python3 systemd-boot-efi
          )
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          case "$ARCHITECTURE" in
            x86_64) uki_stub=/usr/lib/systemd/boot/efi/linuxx64.efi.stub ;;
            aarch64) uki_stub=/usr/lib/systemd/boot/efi/linuxaa64.efi.stub ;;
            *) echo "unsupported architecture: $ARCHITECTURE" >&2; exit 1 ;;
          esac
          test -f "$uki_stub"

      - name: Build built-in Artifact Signing client
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          zig build install-miz
          test -x "$UKI_SIGN_COMMAND"

      - name: Resolve protected signing certificate
        run: |
          set -euo pipefail
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$MIZ_AZURE_TENANT_ID" =~ $uuid ]]
          [[ "$MIZ_AZURE_CLIENT_ID" =~ $uuid ]]
          [[ "$MIZ_ARTIFACT_SIGNING_ENDPOINT" =~ ^https://[a-z0-9.-]+\.codesigning\.azure\.net/?$ ]]
          [[ "$MIZ_ARTIFACT_SIGNING_ACCOUNT" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          [[ "$MIZ_ARTIFACT_SIGNING_PROFILE" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          certificate="$RUNNER_TEMP/miz-uki-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CANDIDATE_KEY}.pem"
          umask 077
          "$UKI_SIGN_COMMAND" sign certificate "$certificate"
          actual=$("$UKI_SIGN_COMMAND" uki fingerprint "$certificate")
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]]
          echo "UKI_SIGNING_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
          echo "UKI_SIGNING_CERTIFICATE_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Prove protected signing before the image build
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          case "$ARCHITECTURE" in
            x86_64) target=x86_64-uefi ;;
            aarch64) target=aarch64-uefi ;;
            *) exit 1 ;;
          esac
          scratch="$SIGNING_PROBE_DIR"
          mkdir -m 0700 "$scratch"
          unsigned="$scratch/unsigned.efi"
          signed="$scratch/signed.efi"
          metadata="$scratch/metadata.json"
          cp "$UKI_SIGNING_CERTIFICATE" "$scratch/certificate.pem"
          zig build-exe -target "$target" tests/efi_signing_probe.zig -femit-bin="$unsigned"
          export MIZ_UKI_UNSIGNED="$unsigned"
          export MIZ_UKI_SIGNED="$signed"
          export MIZ_UKI_CERTIFICATE="$UKI_SIGNING_CERTIFICATE"
          export MIZ_UKI_ARCHITECTURE="$ARCHITECTURE"
          export MIZ_UKI_FLAVOR="$FLAVOR"
          export MIZ_UKI_SIGNING_METADATA="$metadata"
          MIZ_UKI_UNSIGNED_SHA256=$(sha256sum "$unsigned" | awk '{print $1}')
          export MIZ_UKI_UNSIGNED_SHA256
          export MIZ_UKI_CERTIFICATE_SHA256="$UKI_SIGNING_CERTIFICATE_SHA256"
          "$UKI_SIGN_COMMAND" sign
          test -s "$signed"
          test -s "$metadata"
          "$UKI_SIGN_COMMAND" uki verify --certificate "$UKI_SIGNING_CERTIFICATE" "$signed"
          rm -rf -- "$scratch"

      - name: Upload failed signing probe
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-core-signing-probe-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.SIGNING_PROBE_DIR }}/
          if-no-files-found: error
          retention-days: 1

      - name: Build exact finalized Ubuntu core QCOW2
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          rm -rf -- "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR/internal-provenance"
          mkdir -p "$GITHUB_WORKSPACE/$WORK_DIR"
          build_log="$GITHUB_WORKSPACE/$WORK_DIR/build.log"
          sudo -E "$(command -v zig)" build \
            -Dubuntu2604-arch="$ARCHITECTURE" \
            -Dubuntu2604-flavor="$FLAVOR" \
            generalized-ubuntu2604 -- \
            --work-dir "$GITHUB_WORKSPACE/$WORK_DIR" \
            --provenance-dir "$GITHUB_WORKSPACE/$BUNDLE_DIR/internal-provenance" \
            --output "$GITHUB_WORKSPACE/$BUNDLE_DIR/$ASSET_NAME" \
            --size "$VIRTUAL_SIZE" \
            --uki-signing-certificate "$UKI_SIGNING_CERTIFICATE" \
            --uki-signing-certificate-sha256 "$UKI_SIGNING_CERTIFICATE_SHA256" \
            --uki-sign-command "$UKI_SIGN_COMMAND" \
            --uki-sign-command-arg sign \
            2>&1 | tee "$build_log"
          sudo chown -R "$(id -u):$(id -g)" "$WORK_DIR" "$BUNDLE_DIR"
          cp "$build_log" "$BUNDLE_DIR/internal-provenance/build.log"

      - name: Validate standalone zstd QCOW2 and exact 3584 MiB size
        run: |
          set -euo pipefail
          asset="$BUNDLE_DIR/$ASSET_NAME"
          miz="$GITHUB_WORKSPACE/zig-out/bin/miz"
          test -f "$asset"
          test -x "$miz"
          "$miz" check "$asset"
          "$miz" info --output=json "$asset" > "$BUNDLE_DIR/internal-provenance/image-info.json"
          python3 - "$BUNDLE_DIR/internal-provenance/image-info.json" "$VIRTUAL_SIZE" <<'PY'
          import json
          import sys
          info = json.load(open(sys.argv[1], encoding="utf-8"))
          if info.get("format") != "qcow2":
              raise SystemExit("candidate is not QCOW2")
          if info.get("virtual-size") != int(sys.argv[2]):
              raise SystemExit("candidate virtual size is not exactly 3584 MiB")
          if info.get("backing-filename") or info.get("full-backing-filename"):
              raise SystemExit("candidate has a backing file")
          data = (info.get("format-specific") or {}).get("data") or {}
          if data.get("compression-type") != "zstd":
              raise SystemExit("candidate does not use zstd cluster compression")
          PY
          digest=$(sha256sum "$asset" | awk '{print $1}')
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > "$BUNDLE_DIR/internal-provenance/build-validated-digest"

      - name: Create and verify exact core candidate bundle
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          validated=$(<"$BUNDLE_DIR/internal-provenance/build-validated-digest")
          python3 scripts/ubuntu2604_release.py candidate \
            --key "$CANDIDATE_KEY" \
            --architecture "$ARCHITECTURE" \
            --flavor "$FLAVOR" \
            --asset "$BUNDLE_DIR/$ASSET_NAME" \
            --validated-sha256 "$validated" \
            --virtual-size "$VIRTUAL_SIZE" \
            --source-commit "$SOURCE_COMMIT" \
            --provenance-dir "$BUNDLE_DIR/internal-provenance" \
            --runner "$RUNNER_NAME_VALUE" \
            --run-id "$RUN_ID_VALUE" \
            --run-attempt "$RUN_ATTEMPT_VALUE" \
            --output "$BUNDLE_DIR/candidate.json"
          python3 scripts/ubuntu2604_release.py verify-candidate \
            --manifest "$BUNDLE_DIR/candidate.json" \
            --asset "$BUNDLE_DIR/$ASSET_NAME" \
            --key "$CANDIDATE_KEY" \
            --source-commit "$SOURCE_COMMIT"

      - name: Upload exact validated core candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-core-candidate-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.BUNDLE_DIR }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Clean privileged build state
        if: always()
        run: |
          set -uo pipefail
          status=0
          sudo rm -rf -- "$WORK_DIR" "$BUNDLE_DIR" || status=1
          rm -rf -- "$SIGNING_PROBE_DIR" || status=1
          rm -f -- "${UKI_SIGNING_CERTIFICATE:-}" || status=1
          exit "$status"

  native_qemu:
    name: native-QEMU ${{ matrix.key }}
    needs: [prepare, build]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (
          needs.build.result == 'success' ||
          (
            needs.prepare.outputs.reuse_candidates == 'true' &&
            needs.build.result == 'skipped'
          )
        )
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: x86_64-core
            architecture: x86_64
            runner: ubuntu-24.04
            asset_name: Ubuntu-26.04-x86_64.core.qcow2
            android_smoke_secret: ANDROID_SMOKE_X86_64_JSON
          - key: aarch64-core
            architecture: aarch64
            runner: [self-hosted, Linux, ARM64, kvm]
            asset_name: Ubuntu-26.04-aarch64.core.qcow2
            android_smoke_secret: ANDROID_SMOKE_AARCH64_JSON
    env:
      CANDIDATE_KEY: ${{ matrix.key }}
      ARCHITECTURE: ${{ matrix.architecture }}
      FLAVOR: core
      ASSET_NAME: ${{ matrix.asset_name }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      CANDIDATE_DIR: .validation/native/${{ matrix.key }}/candidate
      RESULT_DIR: artifact-staging/core-native-results/${{ matrix.key }}
    steps:
      - name: Require matching native KVM runner
        run: |
          set -euo pipefail
          case "$ARCHITECTURE" in
            x86_64)
              expected_uname=x86_64
              expected_deb=amd64
              ;;
            aarch64)
              expected_uname=aarch64
              expected_deb=arm64
              ;;
            *)
              echo "::error::Unsupported native acceptance architecture: $ARCHITECTURE"
              exit 1
              ;;
          esac
          source /etc/os-release
          test "${ID:-}" = ubuntu
          test "$(uname -m)" = "$expected_uname"
          test "$(dpkg --print-architecture)" = "$expected_deb"
          sudo -n true
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::Matching-architecture native acceptance requires a KVM-capable runner with /dev/kvm"
            exit 1
          fi
          sudo -n chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          python3 - <<'PY'
          import fcntl
          import os

          fd = os.open("/dev/kvm", os.O_RDWR | os.O_CLOEXEC)
          try:
              api_version = fcntl.ioctl(fd, 0xAE00)
          finally:
              os.close(fd)
          if api_version != 12:
              raise SystemExit(f"unsupported KVM API version: {api_version}")
          PY

      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download exact build-validated core candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ubuntu2604-core-candidate-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ needs.prepare.outputs.candidate_run_attempt }}
          path: ${{ env.CANDIDATE_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install native KVM, QEMU, firmware, and vTPM tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(
            ca-certificates curl openssh-client openssl
            python3-virt-firmware qemu-utils
            sbsigntool swtpm swtpm-tools
          )
          case "$ARCHITECTURE" in
            x86_64)
              packages+=(ovmf qemu-system-x86)
              qemu=qemu-system-x86_64
              uefi_code=/usr/share/OVMF/OVMF_CODE_4M.ms.fd
              uefi_vars=/usr/share/OVMF/OVMF_VARS_4M.ms.fd
              ;;
            aarch64)
              packages+=(qemu-efi-aarch64 qemu-system-arm)
              qemu=qemu-system-aarch64
              uefi_code=/usr/share/AAVMF/AAVMF_CODE.ms.fd
              uefi_vars=/usr/share/AAVMF/AAVMF_VARS.ms.fd
              ;;
            *)
              exit 1
              ;;
          esac
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          uefi_code=$(readlink -f -- "$uefi_code")
          uefi_vars=$(readlink -f -- "$uefi_vars")
          test -f "$uefi_code"
          test -f "$uefi_vars"
          test -r "$uefi_code"
          test -r "$uefi_vars"
          {
            echo "MIZ_UBUNTU2604_UEFI_CODE=$uefi_code"
            echo "MIZ_UBUNTU2604_UEFI_VARS=$uefi_vars"
          } >> "$GITHUB_ENV"
          for tool in qemu-img sbverify ssh ssh-keygen swtpm virt-fw-vars; do
            command -v "$tool" >/dev/null
          done
          command -v "$qemu" >/dev/null

      - name: Provision privileged offline-root containment fixture
        run: |
          set -euo pipefail
          fixture=.scratch/offline-root-integration-root
          trap 'sudo rm -rf -- "$fixture"' EXIT
          sudo rm -rf -- "$fixture"
          sudo mkdir -p -- "$fixture"/{bin,usr/bin,lib64,dev,proc,sys,run,tmp,etc}
          sudo cp /bin/bash "$fixture/bin/bash"
          sudo ln -s bash "$fixture/bin/sh"
          sleep_bin=$(readlink -f /usr/bin/sleep)
          test -x "$sleep_bin"
          sudo cp "$sleep_bin" "$fixture/usr/bin/sleep"
          for binary in /bin/bash "$sleep_bin"; do
            sudo cp --parents "$binary" "$fixture"
            while read -r library; do
              [[ -z "$library" ]] || sudo cp --parents "$library" "$fixture"
            done < <(ldd "$binary" | sed -nE 's/.*=>[[:space:]]*(\/[^ ]+).*/\1/p; s/^[[:space:]]*(\/[^ ]+)[[:space:]].*/\1/p')
          done
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          sudo -E "$(command -v zig)" test packages/miz/src/offline_root.zig \
            --test-filter "privileged offline namespace"
          sudo chown -R "$(id -u):$(id -g)" .zig-cache .zig-global-cache 2>/dev/null || true

      - name: Verify candidate and bind native acceptance inputs
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          asset="$CANDIDATE_DIR/$ASSET_NAME"
          manifest="$CANDIDATE_DIR/candidate.json"
          python3 scripts/ubuntu2604_release.py verify-candidate \
            --manifest "$manifest" \
            --asset "$asset" \
            --key "$CANDIDATE_KEY" \
            --source-commit "$SOURCE_COMMIT"
          python3 - "$manifest" "$RESULT_DIR/signing-certificate.der" "$GITHUB_ENV" <<'PY'
          import base64
          import json
          import re
          import sys
          manifest_path, certificate_path, environment_path = sys.argv[1:]
          value = json.load(open(manifest_path, encoding="utf-8"))
          signing = value["uki_signing"]
          values = {
              "MIZ_UBUNTU2604_IMAGE_SHA256": value["sha256"],
              "MIZ_UBUNTU2604_SIGNING_CERTIFICATE_SHA256": signing["certificate_sha256"],
              "MIZ_UBUNTU2604_UKI_SHA256": signing["fallback_uki_sha256"],
          }
          if any(re.fullmatch(r"[0-9a-f]{64}", item) is None for item in values.values()):
              raise SystemExit("candidate signing bindings are malformed")
          certificate = base64.b64decode(signing["certificate_der_base64"], validate=True)
          open(certificate_path, "wb").write(certificate)
          with open(environment_path, "a", encoding="utf-8") as output:
              for name, item in values.items():
                  print(f"{name}={item}", file=output)
          PY
          openssl x509 -inform DER \
            -in "$RESULT_DIR/signing-certificate.der" \
            -out "$RESULT_DIR/signing-certificate.pem"
          echo "MIZ_UBUNTU2604_IMAGE=$GITHUB_WORKSPACE/$asset" >> "$GITHUB_ENV"
          echo "MIZ_UBUNTU2604_SIGNING_CERTIFICATE=$GITHUB_WORKSPACE/$RESULT_DIR/signing-certificate.pem" >> "$GITHUB_ENV"
          echo "MIZ_UBUNTU2604_ACCEPTANCE_RESULT=$GITHUB_WORKSPACE/$RESULT_DIR/native-result.json" >> "$GITHUB_ENV"

      - name: Fetch and verify digest-bound Android container smoke inputs
        env:
          ANDROID_SMOKE_INPUT_VALUE: ${{ secrets[matrix.android_smoke_secret] }}
          ANDROID_ARTIFACT_TOKEN_VALUE: ${{ secrets.ANDROID_ARTIFACT_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          python3 scripts/ubuntu2604_release.py prepare-android-smoke-inputs \
            --architecture "$ARCHITECTURE" \
            --output-dir "$GITHUB_WORKSPACE/.validation/native/$CANDIDATE_KEY/android-smoke" \
            --github-env "$GITHUB_ENV"

      - name: Run matching-architecture native Secure Boot core acceptance
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          zig build --fetch \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build \
            -Dubuntu2604-arch="$ARCHITECTURE" \
            -Dubuntu2604-flavor="$FLAVOR" \
            test-ubuntu2604-acceptance
          test -s "$MIZ_UBUNTU2604_ACCEPTANCE_RESULT"

      - name: Validate exact native core acceptance evidence
        run: |
          set -euo pipefail
          python3 scripts/ubuntu2604_release.py verify-native-result \
            --manifest "$CANDIDATE_DIR/candidate.json" \
            --asset "$CANDIDATE_DIR/$ASSET_NAME" \
            --result "$RESULT_DIR/native-result.json" \
            --key "$CANDIDATE_KEY" \
            --source-commit "$SOURCE_COMMIT"

      - name: Upload native acceptance failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-core-native-failure-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload exact native core acceptance result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-core-native-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}/native-result.json
          if-no-files-found: error
          retention-days: 2

      - name: Remove candidate and local acceptance state
        if: always()
        run: |
          set -uo pipefail
          status=0
          rm -rf -- ".validation/native/$CANDIDATE_KEY" || status=1
          rm -rf -- "$RESULT_DIR" || status=1
          exit "$status"

  azure_acceptance:
    name: Azure ${{ matrix.key }}
    needs: [prepare, build]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (
          needs.build.result == 'success' ||
          (
            needs.prepare.outputs.reuse_candidates == 'true' &&
            needs.build.result == 'skipped'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: ubuntu2604-release
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: x86_64-core
            architecture: x86_64
            asset_name: Ubuntu-26.04-x86_64.core.qcow2
            location_variable: AZURE_LOCATION_X64
            size_variable: AZURE_VM_SIZE_X64
            android_smoke_secret: ANDROID_SMOKE_X86_64_JSON
          - key: aarch64-core
            architecture: aarch64
            asset_name: Ubuntu-26.04-aarch64.core.qcow2
            location_variable: AZURE_LOCATION_ARM64
            size_variable: AZURE_VM_SIZE_ARM64
            android_smoke_secret: ANDROID_SMOKE_AARCH64_JSON
    env:
      CANDIDATE_KEY: ${{ matrix.key }}
      ARCHITECTURE: ${{ matrix.architecture }}
      FLAVOR: core
      ASSET_NAME: ${{ matrix.asset_name }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      CANDIDATE_DIR: .validation/azure/${{ matrix.key }}/candidate
      RESULT_DIR: artifact-staging/core-azure-results/${{ matrix.key }}
      STATE_FILE: .validation/azure/${{ matrix.key }}/resource-group
      AZURE_LOCATION: ${{ vars[matrix.location_variable] }}
      AZURE_VM_SIZE: ${{ vars[matrix.size_variable] }}
      BINDER_PROBE: ${{ github.workspace }}/zig-out/bin/binder-probe-${{ matrix.key }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download exact build-validated core candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ubuntu2604-core-candidate-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ needs.prepare.outputs.candidate_run_attempt }}
          path: ${{ env.CANDIDATE_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}

      - name: Fail closed on missing protected configuration
        env:
          AZURE_CLIENT_ID_VALUE: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID_VALUE: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID_VALUE: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$AZURE_CLIENT_ID_VALUE" =~ $uuid ]]
          [[ "$AZURE_TENANT_ID_VALUE" =~ $uuid ]]
          [[ "$AZURE_SUBSCRIPTION_ID_VALUE" =~ $uuid ]]
          [[ "$AZURE_LOCATION" =~ ^[a-z0-9-]+$ ]]
          [[ "$AZURE_VM_SIZE" =~ ^Standard_[A-Za-z0-9_]+$ ]]

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Require Azure acceptance tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client qemu-utils
          for tool in az azcopy qemu-img ssh ssh-keygen python3; do
            command -v "$tool" >/dev/null
          done
          az version --output json >/dev/null

      - name: Build accepted-source miz
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          zig build --fetch \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          zig build -Doptimize=ReleaseSafe
          test -x zig-out/bin/miz

      - name: Build Binder device usability probe
        run: |
          set -euo pipefail
          unset ZIG_LOCAL_CACHE_DIR
          export ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache
          zig build-exe \
            -target "$ARCHITECTURE-linux" \
            -O ReleaseSmall \
            -static \
            tests/binder_probe.zig \
            -femit-bin="$BINDER_PROBE" \
            --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
          test -x "$BINDER_PROBE"

      - name: Fetch and verify digest-bound Android container smoke inputs
        env:
          ANDROID_SMOKE_INPUT_VALUE: ${{ secrets[matrix.android_smoke_secret] }}
          ANDROID_ARTIFACT_TOKEN_VALUE: ${{ secrets.ANDROID_ARTIFACT_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          python3 scripts/ubuntu2604_release.py prepare-android-smoke-inputs \
            --architecture "$ARCHITECTURE" \
            --output-dir "$GITHUB_WORKSPACE/.validation/azure/$CANDIDATE_KEY/android-smoke" \
            --github-env "$GITHUB_ENV"

      - name: Log in to Azure with protected-environment OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run exact-digest Azure Trusted Launch core acceptance
        env:
          MIZ: ${{ github.workspace }}/zig-out/bin/miz
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export GITHUB_RUN_ID=$RUN_ID_VALUE
          export GITHUB_RUN_ATTEMPT=$RUN_ATTEMPT_VALUE
          scripts/ubuntu2604_azure_acceptance.sh run

      - name: Refresh Azure OIDC credential for unconditional cleanup
        if: always()
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete only ownership-tagged temporary Azure resources
        if: always()
        env:
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          export GITHUB_RUN_ID=$RUN_ID_VALUE
          export GITHUB_RUN_ATTEMPT=$RUN_ATTEMPT_VALUE
          if [[ -x scripts/ubuntu2604_azure_acceptance.sh ]]; then
            scripts/ubuntu2604_azure_acceptance.sh cleanup
          elif [[ -s "$STATE_FILE" ]]; then
            echo "::error::Cleanup script is absent while Azure state exists"
            exit 1
          fi

      - name: Upload failed Azure acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-core-azure-failure-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ env.RESULT_DIR }}/*.json
            ${{ env.RESULT_DIR }}/boot.log
            ${{ env.RESULT_DIR }}/uefi-db.bin
          if-no-files-found: warn
          retention-days: 2

      - name: Upload exact Azure core acceptance result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-core-azure-${{ matrix.key }}-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_DIR }}/azure-result.json
          if-no-files-found: error
          retention-days: 2

      - name: Remove derived VHD and local credentials
        if: always()
        run: |
          set -uo pipefail
          status=0
          rm -rf -- ".validation/azure/$CANDIDATE_KEY" || status=1
          rm -rf -- "$RESULT_DIR" || status=1
          exit "$status"

  validate:
    name: verify complete two-architecture core validation
    needs: [prepare, build, native_qemu, azure_acceptance]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (
          needs.build.result == 'success' ||
          (
            needs.prepare.outputs.reuse_candidates == 'true' &&
            needs.build.result == 'skipped'
          )
        ) &&
        needs.native_qemu.result == 'success' &&
        needs.azure_acceptance.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
      CANDIDATE_RUN_ATTEMPT: ${{ needs.prepare.outputs.candidate_run_attempt }}
      CANDIDATES_DIR: .validation/gate/candidates
      NATIVE_RESULTS_DIR: .validation/gate/native
      AZURE_RESULTS_DIR: .validation/gate/azure
      BUNDLE_DIR: artifact-staging/core-validation
    steps:
      - name: Check out accepted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Download both build-validated core candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ubuntu2604-core-candidate-*-${{ needs.prepare.outputs.source_commit }}-${{ needs.prepare.outputs.candidate_run_attempt }}
          path: ${{ env.CANDIDATES_DIR }}
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}

      - name: Download both native-QEMU core acceptance results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ubuntu2604-core-native-*-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_RESULTS_DIR }}
          merge-multiple: false

      - name: Download both Azure core acceptance results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ubuntu2604-core-azure-*-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.AZURE_RESULTS_DIR }}
          merge-multiple: false

      - name: Validate exact two-architecture core gate
        env:
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -rf -- "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          python3 - \
            "$CANDIDATES_DIR" \
            "$NATIVE_RESULTS_DIR" \
            "$AZURE_RESULTS_DIR" \
            "$BUNDLE_DIR/validation.json" \
            "$SOURCE_COMMIT" \
            "$CANDIDATE_RUN_ID" \
            "$CANDIDATE_RUN_ATTEMPT" \
            "$RUN_ID_VALUE" \
            "$RUN_ATTEMPT_VALUE" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          from scripts import ubuntu2604_release as release

          (
              candidates_root,
              native_root,
              azure_root,
              output_path,
          ) = map(Path, sys.argv[1:5])
          (
              source_commit,
              candidate_run_id,
              candidate_run_attempt,
              run_id,
              run_attempt,
          ) = sys.argv[5:]
          expected = {
              "x86_64-core": "Ubuntu-26.04-x86_64.core.qcow2",
              "aarch64-core": "Ubuntu-26.04-aarch64.core.qcow2",
          }
          candidate_docs = list(candidates_root.rglob("candidate.json"))
          native_docs = list(native_root.rglob("native-result.json"))
          azure_docs = list(azure_root.rglob("azure-result.json"))
          qcow_paths = list(candidates_root.rglob("*.qcow2"))
          if (
              len(candidate_docs) != 2
              or len(native_docs) != 2
              or len(azure_docs) != 2
              or len(qcow_paths) != 2
          ):
              raise SystemExit("core gate did not receive two candidates, two native results, two Azure results, and two images")

          def load_by_key(paths):
              result = {}
              for path in paths:
                  value = json.load(open(path, encoding="utf-8"))
                  key = value.get("key")
                  if key not in expected or key in result:
                      raise SystemExit("unexpected or duplicate core result")
                  result[key] = (path, value)
              if set(result) != set(expected):
                  raise SystemExit("core validation matrix is incomplete")
              return result

          candidates = load_by_key(candidate_docs)
          azure = load_by_key(azure_docs)

          native = {}
          native_digests = set()
          for path in native_docs:
              value = json.load(open(path, encoding="utf-8"))
              android_smoke = value.get("android_smoke")
              key = (
                  android_smoke.get("candidate_key")
                  if isinstance(android_smoke, dict)
                  else None
              )
              digest = value.get("candidate_sha256")
              if key not in expected or key in native:
                  raise SystemExit("unexpected or duplicate native core result")
              if not isinstance(digest, str):
                  raise SystemExit(f"{key}: native candidate digest is malformed")
              if digest in native_digests:
                  raise SystemExit("duplicate native acceptance digest")
              native[key] = (path, value)
              native_digests.add(digest)
          if set(native) != set(expected):
              raise SystemExit("core native validation matrix is incomplete")
          if {path.name for path in qcow_paths} != set(expected.values()):
              raise SystemExit("core candidate asset set is not exact")

          records = []
          for key, asset_name in expected.items():
              manifest_path, candidate = candidates[key]
              asset_path = manifest_path.parent / asset_name
              candidate = release.verify_candidate(
                  manifest_path,
                  asset_path,
                  key=key,
                  source_commit=source_commit,
              )
              if candidate.get("workflow") != {
                  "run_id": candidate_run_id,
                  "run_attempt": candidate_run_attempt,
              }:
                  raise SystemExit(f"{key}: candidate workflow attempt is not exact")
              native_path, native_result = native[key]
              if native_result.get("candidate_sha256") != candidate["sha256"]:
                  raise SystemExit(f"{key}: native result is not candidate-key/digest bound")
              release.validate_native_result(
                  manifest_path,
                  asset_path,
                  native_path,
                  key=key,
                  source_commit=source_commit,
              )
              azure_path, azure_result = azure[key]
              release.validate_azure_result(
                  manifest_path,
                  asset_path,
                  azure_path,
                  key=key,
                  source_commit=source_commit,
              )
              if native_result.get("android_smoke") != azure_result.get("android_smoke"):
                  raise SystemExit(f"{key}: native and Azure Android smoke provenance differ")
              if azure_result.get("workflow") != {
                  "run_id": run_id,
                  "run_attempt": run_attempt,
              }:
                  raise SystemExit(f"{key}: Azure workflow attempt is not exact")

              def digest(path):
                  return hashlib.sha256(path.read_bytes()).hexdigest()

              records.append(
                  {
                      "key": key,
                      "asset_name": asset_name,
                      "candidate_sha256": candidate["sha256"],
                      "candidate_manifest_sha256": digest(manifest_path),
                      "native_result_sha256": digest(native_path),
                      "azure_result_sha256": digest(azure_path),
                      "android_smoke": native_result["android_smoke"],
                  }
              )
          output = {
              "schema": 2,
              "type": "miz-ubuntu2604-core-validation",
              "source_commit": source_commit,
              "candidate_workflow": {
                  "run_id": candidate_run_id,
                  "run_attempt": candidate_run_attempt,
              },
              "validation_workflow": {
                  "run_id": run_id,
                  "run_attempt": run_attempt,
              },
              "candidates": records,
          }
          output_path.write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload digest-bound complete core validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu2604-core-validation-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ env.BUNDLE_DIR }}/validation.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove validation staging
        if: always()
        run: |
          set -uo pipefail
          status=0
          rm -rf -- .validation/gate || status=1
          rm -rf -- "$BUNDLE_DIR" || status=1
          exit "$status"
