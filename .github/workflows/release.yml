name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@3f92e616222f9f5965921619e0ae2804c01ef6c5 # v0.6.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build release contract tool
        run: zig build install-miz-release -Doptimize=ReleaseSafe

      - name: Match tag and package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          zig-out/bin/miz_release verify-version \
            --tag "$GITHUB_REF_NAME" \
            --manifest build.zig.zon \
            --github-output "$GITHUB_OUTPUT"
          {
            echo "### Verified release version"
            echo
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- Package: \`${GITHUB_REF_NAME#v}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux-musl
            name: linux-musl-x64
            executable: miz
          - os: ubuntu-22.04-arm
            target: aarch64-linux-musl
            name: linux-musl-arm64
            executable: miz
          - os: ubuntu-22.04
            target: x86_64-macos
            name: macos-x64
            executable: miz
          - os: macos-14
            target: aarch64-macos
            name: macos-arm64
            executable: miz
          - os: windows-latest
            target: x86_64-windows
            name: windows-x64
            executable: miz.exe
          - os: ubuntu-22.04
            target: aarch64-windows
            name: windows-arm64
            executable: miz.exe

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@3f92e616222f9f5965921619e0ae2804c01ef6c5 # v0.6.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build
        run: zig build install-miz -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.name }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail

          package="miz-${VERSION}-${PLATFORM}"
          source_executable="zig-out/bin/${EXECUTABLE}"
          test -f "$source_executable"
          test -f doc/readme.md

          mkdir -p "$package/bin"
          cp "$source_executable" "$package/bin/"
          cp LICENSE README.md THIRD_PARTY_NOTICES.md "$package/"
          cp -R doc "$package/"

          executable_count=$(find "$package/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$executable_count" = 1
          tar czf "$package.tar.gz" "$package"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: zig-out/bin/${{ matrix.executable }}
          output-file: miz-${{ needs.verify.outputs.version }}-${{ matrix.name }}.sbom.spdx.json
          upload-artifact: false

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: |
            miz-*.tar.gz
            miz-*.sbom.spdx.json
          if-no-files-found: error

  release:
    name: Create Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: miz-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@3f92e616222f9f5965921619e0ae2804c01ef6c5 # v0.6.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build release publisher
        run: zig build install-miz-release -Doptimize=ReleaseSafe

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: miz-*.tar.gz

      - name: Mint immutable-release policy token
        id: release_policy_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
          permission-contents: read

      - name: Publish verified draft exactly once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIZ_RELEASE_POLICY_GH_TOKEN: ${{ steps.release_policy_token.outputs.token }}
        run: |
          set -euo pipefail
          zig-out/bin/miz_release publish \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "${{ needs.verify.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --assets-directory "$GITHUB_WORKSPACE" \
            --workspace "$GITHUB_WORKSPACE/.miz-release" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"
